      </div>
      <div class="card lift"><span class="eyebrow">Tu análisis</span>${an ? `<div class="analysis" style="margin-top:10px">${an.paragraphs.map(p => `<p>${p}</p>`).join('')}${an.priorities.length ? `<div><div class="eyebrow plain" style="margin-bottom:8px">Prioridad recomendada</div><ol>${an.priorities.map(p => `<li>${esc(p)}</li>`).join('')}</ol></div>` : ''}<p class="small muted">Análisis elaborado a partir de tus respuestas registradas · ${fmtDate(an.date)}</p></div>`
        : `<p class="muted" style="margin-top:10px">Tu análisis personal aparecerá cuando hayas respondido al menos 20 preguntas. Solo recogerá lo que respalden tus datos.</p>`}</div>
      ${rec.length ? `<div class="card"><span class="eyebrow">Contenidos que necesitan recuperación</span><div class="tablewrap" style="margin-top:12px"><table class="t"><thead><tr><th>Contenido</th><th>Tema</th><th>Motivo</th></tr></thead><tbody>${rec.map(x => `<tr><td>${esc(Catalog.conceptLabel(x.c))}</td><td>${x.t}</td><td>${x.why.map(w => ({ err: 'error pendiente', reinc: 'reincidente', hc: 'fallado con seguridad alta', due: 'riesgo de olvido', old: 'comprobar dominio', weakcat: 'categoría débil' }[w])).join(', ')}</td></tr>`).join('')}</tbody></table></div></div>` : ''}
      ${H.length ? `<div class="card"><span class="eyebrow">Historial</span><div class="tablewrap" style="margin-top:12px"><table class="t"><thead><tr><th>Fecha</th><th>Tipo</th><th>Temas</th><th>Nivel</th><th>Modo</th><th style="text-align:right">Resultado</th></tr></thead><tbody>${H.slice().reverse().slice(0, 40).map(q => `<tr><td>${fmtShort(q.t)}</td><td>${esc(KINDS[q.kind] || q.kind)}</td><td>${(q.temas || []).join(', ')}</td><td>${q.lvl === 'mix' || !q.lvl ? 'Mixto' : LEVELS[q.lvl]}</td><td>${q.mode === 'exam' ? 'Examen' : 'Aprendizaje'}</td><td class="num">${q.ok}/${q.n} · ${pct(q.ok, q.n)} %</td></tr>`).join('')}</tbody></table></div></div>` : ''}
      <div class="card"><span class="eyebrow">Tus datos</span><p class="small muted" style="margin:8px 0 12px">${Store.mode === 'cloud' ? 'Tu progreso se guarda en tu cuenta y solo tú puedes verlo. El preparador únicamente ve estadísticas agregadas y anónimas.' : WEB ? `Tu progreso se guarda automáticamente en este dispositivo, en el perfil «${esc(PROFILE ? PROFILE.name : '')}». No sale de aquí: nadie más lo ve, tampoco tu preparador. Para seguir en otro móvil u ordenador, descarga una copia y restáurala allí. Si borras los datos del navegador, se pierde.` : 'Tu progreso se guarda en este navegador. Descarga una copia de seguridad de vez en cuando para no perderlo o para llevarlo a otro dispositivo.'}</p>
        <div class="row">${Store.downloads || WEB ? `<button class="btn btn-ghost btn-sm" data-act="export">${ICON.download} Descargar copia de seguridad</button>` : `<button class="btn btn-ghost btn-sm" data-act="export-copy">${ICON.download} Copiar copia de seguridad</button>`}
          <label class="btn btn-ghost btn-sm">${ICON.upload} Restaurar copia<input type="file" id="importFile" accept=".json,application/json" class="sr"></label></div></div>
    </div>`;
  },

  /* ================= VISOR DEL TEMA ================= */
  showSource(qid) {
    const q = Catalog.byId.get(qid); if (!q) return;
    const f = q.f[0];
    this.showDoc(f.t, f.s, q.f.filter(x => x.t === f.t && x.s === f.s));
  },
  showDoc(n, sid, hits = []) {
    const t = Catalog.topics[n]; if (!t) return;
    const sec = t.sections.find(s => s.id === sid) || t.sections[0];
    const blocks = sec.blocks.map((b, i) => {
      let html = esc(b.t);
      const h = hits.find(x => x.b === i);
      if (h) {
        const nb = normQ(b.t), nf = normQ(h.x), at = nb.indexOf(nf);
        if (at >= 0) html = esc(b.t.slice(0, at)) + '<mark>' + esc(b.t.slice(at, at + nf.length)) + '</mark>' + esc(b.t.slice(at + nf.length));
      }
      const hitCls = h ? ' hit" id="hit' : '';
      if (b.k === 'h') return `<h4 class="${hitCls}">${html}</h4>`;
      if (b.k === 'li') return `<ul><li class="${b.l ? 'sub' : ''}${hitCls}">${html}</li></ul>`;
      return `<p class="${hitCls}">${html}</p>`;
    }).join('');
    this.modal(`<div class="stack" style="gap:4px;flex:1;min-width:0"><span class="eyebrow">Tema ${n}${t.file ? ' · ' + esc(t.file) : ''}</span><b style="font-family:var(--f-display)">${esc(sec.title)}</b></div>`,
      `<div class="row"><select id="docSec" data-n="${n}" class="btn btn-ghost btn-sm" aria-label="Apartado">${t.sections.map(s => `<option value="${esc(s.id)}" ${s.id === sec.id ? 'selected' : ''}>${esc(s.title)}</option>`).join('')}</select></div><div class="doc">${blocks}</div>`);
    const hit = document.getElementById('hit'); if (hit) setTimeout(() => hit.scrollIntoView({ block: 'center' }), 30);
  },
  modal(head, body, foot) {
    const m = document.getElementById('modal');
    m.innerHTML = `<div class="modal__box" role="dialog" aria-modal="true"><div class="modal__head">${head}<button class="btn btn-quiet btn-sm" data-act="close-modal" aria-label="Cerrar">${ICON.x}</button></div><div class="modal__body">${body}</div>${foot ? `<div class="modal__foot">${foot}</div>` : ''}</div>`;
    m.hidden = false; this._modalOpen = true;
    const b = m.querySelector('[data-act="close-modal"]'); b && b.focus({ preventScroll: true });
  },
  closeModal() { const m = document.getElementById('modal'); m.hidden = true; m.innerHTML = ''; this._modalOpen = false; if (this.onModalClose) { const f = this.onModalClose; this.onModalClose = null; f(); } },

  /* ================= ACCIONES ================= */
  onClick(e) {
    const el = e.target.closest('[data-act]');
    if (!el) { if (e.target.id === 'modal') this.closeModal(); return; }
    const a = el.dataset.act;
    const H = this.actions[a];
    if (H) { e.preventDefault(); H.call(this, el, e); }
    else if (Admin.actions[a]) { e.preventDefault(); Admin.actions[a].call(Admin, el, e); }
  },
  onChange(e) {
    const id = e.target.id, v = e.target.value;
    if (e.target.dataset.act === 'match') { const { it } = this.cur(); it.ans[+e.target.dataset.i] = v === '' ? null : +v; this.saveSession(); this.render(); return; }
    if (id === 'optConf') { this.cfg.conf = e.target.checked; this.saveCfg(); }
    else if (id === 'optSmart') { this.cfg.dist = e.target.checked ? 'smart' : 'bal'; this.saveCfg(); }
    else if (id === 'errScope') { this.escope = v; if (v === 'tema' && !this.etopic) this.etopic = (Errors.list()[0] || {}).t || 0; this.render(); }
    else if (id === 'errTopicSel') { this.etopic = +v; }
    else if (id === 'errTopic') { this.etopic = +v; this.render(); }
    else if (id === 'simMonth') { this.sim.month = v; this.render(); }
    else if (id === 'simConf') { this.sim.conf = e.target.checked; }
    else if (id === 'docSec') { this.showDoc(+e.target.dataset.n, v); }
    else if (id === 'importFile') { const f = e.target.files[0]; if (f) f.text().then(t => Store.importData(t)).then(() => { this.toast('Copia de seguridad restaurada.'); this.render(); }).catch(err => this.toast(err.message || 'No se pudo restaurar la copia.')); }
    else Admin.onChange && Admin.onChange(e);
  },
  onInput(e) {
    if (e.target.id === 'customCount') { this.cfg.custom = e.target.value; this.saveCfg(); clearTimeout(this._ct); this._ct = setTimeout(() => { const pos = e.target.selectionStart; this.render(); const i = document.getElementById('customCount'); if (i) { i.focus(); try { i.setSelectionRange(pos, pos); } catch (x) { } } }, 450); }
    else Admin.onInput && Admin.onInput(e);
  },
  onKey(e) {
    if (e.key === 'Escape' && this._modalOpen) { this.closeModal(); return; }
    if (this.route !== 'quiz' || this._modalOpen || /input|select|textarea/i.test(e.target.tagName)) return;
    const { s, it, q } = this.cur(); if (!q) return;
    const locked = s.mode === 'learn' && it.checked;
    const k = e.key.toLowerCase();
    if (k === 'enter') { e.preventDefault(); if (locked) return s.idx === s.items.length - 1 ? this.finish() : this.move(1); if (!s.conf || s.mode === 'exam') return this.check(); }
    if (locked) return;
    if (q.y === 'v' && (k === 'v' || k === 'f')) { it.ans = k === 'v'; this.saveSession(); this.render(); return; }
    const idx = '12345'.indexOf(k) >= 0 ? '12345'.indexOf(k) : 'abcde'.indexOf(k);
    if (idx >= 0 && it.perm && idx < it.perm.length) { this.pickOption(it.perm[idx]); }
    if (s.mode === 'exam' && k === 'arrowright') this.move(1);
    if (s.mode === 'exam' && k === 'arrowleft') this.move(-1);
  },
  pickOption(orig) {
    const { it, q } = this.cur();
    if (q.y === 'm') { const i = it.ans.indexOf(orig); if (i >= 0) it.ans.splice(i, 1); else it.ans.push(orig); }
    else it.ans = orig;
    this.saveSession(); this.render();
  },
  saveCfg() { LS.set('cfg', this.cfg); },

  actions: {
    nav(el) { if (this.route === 'quiz' && this.session && !this.session.done) { this.confirmKey = 'quit'; this.render(); return; } this.go(el.dataset.r); },
    'close-modal'() { this.closeModal(); },
    resume() { this.session = this.pendingSession; this.pendingSession = null; this._focusQ = true; this.go('quiz'); },
    discard() { LS.del('session'); this.pendingSession = null; this.render(); },
    // Configurador
    'tog-topic'(el) { const n = +el.dataset.n, t = this.cfg.topics; const i = t.indexOf(n); if (i >= 0) t.splice(i, 1); else t.push(n); this.saveCfg(); this.render(); },
    'sel-all'() { this.cfg.topics = Catalog.activeList(); this.saveCfg(); this.render(); },
    'sel-none'() { this.cfg.topics = []; this.saveCfg(); this.render(); },
    'sel-month'(el) { const m = (Catalog.config.months || []).find(x => x.id === el.dataset.m); if (m) { this.cfg.topics = m.topics.filter(n => Catalog.active(n)); this.saveCfg(); this.render(); } },
    'set-count'(el) { const v = el.dataset.v; this.cfg.count = v === 'custom' ? 'custom' : +v; this.saveCfg(); this.render(); if (v === 'custom') { const i = document.getElementById('customCount'); i && i.focus(); } },
    'set-level'(el) { const v = el.dataset.v; this.cfg.level = v === 'mix' ? 'mix' : +v; this.cfg.fill = false; this.saveCfg(); this.render(); },
    'set-mode'(el) { this.cfg.mode = el.dataset.v; this.saveCfg(); this.render(); },
    'use-avail'() { const c = this.cfg; const have = Engine.countFor(c.topics, c.level); c.count = 'custom'; c.custom = String(have); this.saveCfg(); this.render(); },
    'fill-levels'() { this.startPractice(true); },
    'start-practice'() { this.startPractice(false); },
    // Cuestionario
    opt(el) { if (el.dataset.v !== undefined) { const { it } = this.cur(); it.ans = el.dataset.v === 'true'; this.saveSession(); this.render(); } else this.pickOption(+el.dataset.o); },
    conf(el) { const { s, it } = this.cur(); it.conf = el.dataset.c; this.saveSession(); if (s.mode === 'exam') { this.render(); setTimeout(() => { if (this.session === s && s.idx < s.items.length - 1) this.move(1); }, 220); } else this.check(); },
    check() { this.check(); },
    skip() { const { it, q } = this.cur(); it.ans = q.y === 'm' ? [] : q.y === 'r' ? q.p.map(() => null) : null; it.conf = null; it.checked = true; it.ok = null; this.saveSession(); this.render(); },
    clear() { const { it, q } = this.cur(); it.ans = q.y === 'm' ? [] : q.y === 'r' ? q.p.map(() => null) : null; it.conf = null; this.saveSession(); this.render(); },
    next() { this.move(1); },
    prev() { this.move(-1); },
    goto(el) { const s = this.session; s.idx = +el.dataset.i; this.confirmKey = null; this.saveSession(); this.render(); },
    finish() { const s = this.session; const left = s.items.filter(i => !Engine.answered(Catalog.byId.get(i.id) || {}, i)).length; if (left) { this.confirmKey = 'finish'; this.render(); } else this.finish(); },
    'finish-now'() { this.finish(); },
    quit() { this.confirmKey = 'quit'; this.render(); },
    abandon() { LS.del('session'); this.session = null; this.go('inicio'); },
    'cancel-confirm'() { this.confirmKey = null; this.render(); },
    source(el) { this.showSource(el.dataset.q); },
    'read-topic'(el) { const n = +el.dataset.n; const t = Catalog.topics[n]; if (t) this.showDoc(n, t.sections[0].id); },
    // Resultados
    'retry-these'() { const ids = this.result.session.items.filter(it => { const q = Catalog.byId.get(it.id); return q && Engine.grade(q, it) === false; }).map(i => i.id); this.startCustom(ids.map(id => Catalog.byId.get(id)), 'errores', 'Repetir errores del test'); },
    'new-these'() { const cs = uniq(this.result.session.items.filter(it => { const q = Catalog.byId.get(it.id); return q && Engine.grade(q, it) === false; }).map(i => Catalog.byId.get(i.id).c)); this.newOnConcepts(cs, 'Nuevas preguntas sobre mis errores'); },
    // Repaso
    'review-today'(el) { this.reviewToday(+el.dataset.n || 10); },
    weak(el) { const t = +(document.getElementById('weakTopic') || {}).value || 0; this.weakPoints(+el.dataset.n, t); },
    'weak-topic'(el) { this.weakPoints(15, +el.dataset.n); },
    'train-topic'(el) { const n = +el.dataset.n; this.startSession({ kind: 'tema', title: `Entrenar el Tema ${n}`, topics: [n], count: 15, level: 'mix', mode: 'learn', dist: 'smart', conf: this.cfg.conf }); },
    reto(el) { const src = (document.getElementById('retoSrc') || {}).value || 'varios'; this.reto(src); },
    'err-retry'() { const es = Errors.select(this.escope, this.etopic); const ids = es.flatMap(e => Object.keys(e.items)); const qs = ids.map(id => Catalog.byId.get(id)).filter(Boolean); if (!qs.length) return this.toast('No hay errores en esa selección.'); this.startCustom(shuffle(qs).slice(0, 50), 'errores', 'Volver a intentar mis errores'); },
    'err-new'() { const es = Errors.select(this.escope, this.etopic); if (!es.length) return this.toast('No hay errores en esa selección.'); this.newOnConcepts(es.map(e => e.c), 'Nuevas preguntas sobre mis errores'); },
    'err-ai'() { const es = Errors.select(this.escope, this.etopic).filter(e => e.st !== 's'); if (!es.length) return this.toast('No hay errores pendientes en esa selección.'); this.aiOnConcepts(es.sort((a, b) => (b.hc - a.hc) || (b.cnt - a.cnt)).slice(0, 4).map(e => e.c)); },
    'concept-new'(el) { this.newOnConcepts([el.dataset.c], 'Nuevas preguntas sobre ' + Catalog.conceptLabel(el.dataset.c)); },
    'concept-retry'(el) { const e = Store.state.er[el.dataset.c]; const qs = Object.keys(e.items).map(id => Catalog.byId.get(id)).filter(Boolean); if (!qs.length) return this.toast('Esas preguntas ya no están en el banco.'); this.startCustom(qs, 'errores', 'Volver a intentar'); },
    efilter(el) { this.efilter = el.dataset.v; this.render(); },
    // Simulacros
    'sim-n'(el) { this.sim.n = +el.dataset.v; this.render(); },
    'sim-l'(el) { this.sim.level = el.dataset.v === 'mix' ? 'mix' : +el.dataset.v; this.render(); },
    'sim-month'() { const m = (Catalog.config.months || []).find(x => x.id === this.sim.month); if (!m) return; this.startSession({ kind: 'simulacro', title: `Simulacro · ${m.name}`, topics: m.topics.filter(n => Catalog.active(n)), count: this.sim.n, level: this.sim.level, mode: 'exam', dist: 'bal', conf: this.sim.conf }); },
    'sim-all'() { this.startSession({ kind: 'simulacro', title: 'Simulacro acumulativo', topics: Catalog.activeList(), count: this.sim.n, level: this.sim.level, mode: 'exam', dist: 'bal', conf: this.sim.conf }); },
    // Radiografía
    xsel(el) { this.xsel = +el.dataset.n; this.render(); const d = document.getElementById('tdetail'); if (d && window.innerWidth < 820) d.scrollIntoView({ block: 'start', behavior: 'smooth' }); },
    // Datos
    async export() {
      if (WEB) {
        const name = `entrena-tu-temario-${slug(PROFILE ? PROFILE.name : 'perfil') || 'perfil'}-${new Date().toISOString().slice(0, 10)}.json`;
        const url = URL.createObjectURL(new Blob([Store.exportData()], { type: 'application/json' }));
        const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 4000); this.toast('Copia de seguridad descargada.'); return;
      }
      try { await Store.downloads.save({ filename: `entrena-tu-temario-${new Date().toISOString().slice(0, 10)}.json`, data: Store.exportData() }); this.toast('Copia de seguridad descargada.'); } catch (e) { if (!e || e.code !== 'cancelled') this.toast('No se pudo descargar la copia.'); } },
    profiles() { Profiles.open(); },
    'p-use'(el) { Profiles.use(el.dataset.id); },
    'p-add'() { Profiles.add(); },
    'p-rename'() { Profiles.rename(); },
    'p-askdel'(el) { Profiles.askDel(el.dataset.id); },
    'p-del'(el) { Profiles.del(el.dataset.id); },
    'export-copy'() { const t = Store.exportData(); navigator.clipboard.writeText(t).then(() => this.toast('Copia de seguridad copiada al portapapeles. Guárdala en un archivo .json.')).catch(() => this.modal('<b>Copia de seguridad</b>', `<p class="small muted">Selecciona todo el texto y guárdalo en un archivo .json.</p><textarea style="width:100%;min-height:240px;font-family:ui-monospace,monospace;font-size:12px">${esc(t)}</textarea>`)); }
  },

  startPractice(fill) {
    const c = this.cfg; const count = c.count === 'custom' ? clamp(parseInt(c.custom, 10) || 0, 1, 100) : c.count;
    this.startSession({ kind: 'practica', title: 'Práctica', topics: c.topics.slice(), count, level: c.level, mode: c.mode, dist: c.dist, conf: c.conf, fillLevels: !!fill, from: 'practicar' });
  },
  startCustom(qs, kind, title, extra = {}) {
    qs = qs.filter(Boolean); if (!qs.length) return this.toast('No hay preguntas disponibles.');
    this.startSession(Object.assign({ kind, title, questions: qs, count: qs.length, level: 'mix', mode: 'learn', dist: 'smart', conf: this.cfg.conf }, extra));
  },
  reviewToday(n) {
    const cs = Recommend.concepts().slice(0, 14).map(x => x.c);
    if (!cs.length) return this.toast('Todavía no hay contenidos que recuperar.');
    this.startSession({ kind: 'repaso', title: 'Repaso recomendado', topics: Catalog.activeList(), count: n, level: 'mix', mode: 'learn', dist: 'smart', conf: this.cfg.conf, focusConcepts: cs, includeGen: true });
  },
  weakPoints(n, t) {
    const w = Engine.conceptWeakness();
    let cs = Object.entries(w).sort((a, b) => b[1] - a[1]).map(x => x[0]);
    if (t) cs = cs.filter(c => (Catalog.concepts[c] || {}).t === t);
    const topics = t ? [t] : Catalog.activeList();
    if (!cs.length) {
      // Sin errores aún: temas con menor dominio.
      const ranked = topics.map(x => ({ x, m: Mastery.topic(x) })).sort((a, b) => (a.m.n ? a.m.idx : 50) - (b.m.n ? b.m.idx : 50));
      return this.startSession({ kind: 'debiles', title: 'Mis puntos débiles', topics: ranked.slice(0, 3).map(r => r.x), count: n, level: 'mix', mode: 'learn', dist: 'smart', conf: this.cfg.conf });
    }
    const failed = new Set(Object.values(Store.state.er).flatMap(e => Object.keys(e.items)));
    const recentFail = new Set([...failed].filter(id => (Store.state.qs[id] || [])[2] >= today() - 2));
    this.startSession({ kind: 'debiles', title: 'Mis puntos débiles', topics, count: n, level: 'mix', mode: 'learn', dist: 'smart', conf: this.cfg.conf, focusConcepts: cs.slice(0, 16), exclude: recentFail, includeGen: true });
  },
  reto(src) {
    const base = { kind: 'reto', title: 'Reto de 5', count: 5, level: 'mix', mode: 'learn', dist: 'bal', conf: this.cfg.conf };
    if (src === 'recomendados') { const cs = Recommend.concepts().slice(0, 8).map(x => x.c); if (!cs.length) return this.startSession(Object.assign(base, { topics: Catalog.activeList() })); return this.startSession(Object.assign(base, { topics: Catalog.activeList(), focusConcepts: cs, dist: 'smart', includeGen: true })); }
    if (src === 'errores') { const es = Errors.list().filter(e => e.st !== 's'); if (!es.length) return this.toast('No tienes errores pendientes.'); const failed = new Set(es.flatMap(e => Object.keys(e.items))); let pool = uniq(es.map(e => e.c)).flatMap(c => Catalog.qByConcept.get(c) || []); const fresh = pool.filter(q => !failed.has(q.id)); pool = fresh.length >= 5 ? fresh : pool; return this.startCustom(shuffle(pool).slice(0, 5), 'reto', 'Reto de 5 · mis errores'); }
    if (src && src[0] === 't') return this.startSession(Object.assign(base, { topics: [+src.slice(1)], title: `Reto de 5 · Tema ${src.slice(1)}` }));
    this.startSession(Object.assign(base, { topics: Catalog.activeList() }));
  },
  // Preguntas DIFERENTES sobre los mismos contenidos (no las ya falladas).
  newOnConcepts(cs, title) {
    cs = uniq(cs);
    const failed = new Set(cs.flatMap(c => Object.keys((Store.state.er[c] || {}).items || {})));
    const pool = cs.flatMap(c => (Catalog.qByConcept.get(c) || []).filter(q => !failed.has(q.id)));
    if (!pool.length) {
      if (AI.available()) return this.aiOnConcepts(cs.slice(0, 4));
      return this.toast('No quedan preguntas diferentes sobre ese contenido en el banco.');
    }
    const n = clamp(Math.max(cs.length * 2, 10), 1, 30);
    this.startSession({ kind: 'errores', title, questions: pool, count: Math.min(n, pool.length), level: 'mix', mode: 'learn', dist: 'smart', conf: this.cfg.conf, focusConcepts: cs });
  },
  // IA: nuevas preguntas inéditas a partir de la FUENTE de los errores (RAG + auditoría).
  async aiOnConcepts(cs) {
    if (!AI.available() || this.busy) return;
    this.busy = true;
    const ctl = new AbortController();
    this.onModalClose = () => ctl.abort();
    const log = [];
    const paint = (msg, p) => { log.push(msg); this.modal(`<div class="stack" style="gap:4px;flex:1"><span class="eyebrow">Preguntas nuevas con IA</span><b style="font-family:var(--f-display)">Recuperando la fuente y generando preguntas</b></div>`, `<p class="small muted">Se generan solo con los fragmentos del temario de tus errores y cada pregunta pasa una revisión automática antes de mostrarse. Puede tardar un minuto. Se usa tu cuenta de Claude.</p><div class="progressbar"><i style="width:${p}%"></i></div><div class="log">${log.map(esc).join('\n')}</div>`); this.onModalClose = () => ctl.abort(); };
    const accepted = [];
    try {
      for (let i = 0; i < cs.length; i++) {
        const c = cs[i], ctx = AI.contextForConcept(c);
        paint(`${i + 1}/${cs.length} · ${Catalog.conceptLabel(c)}: recuperando fragmentos…`, Math.round(100 * i / cs.length));
        if (!ctx || !ctx.text) continue;
        const e = Store.state.er[c]; const lv = e ? Math.max(...Object.values(e.items).map(x => x.l || 2)) : 2;
        const r = await AI.generateValidated(ctx, 3, { prefix: 'g', concept: c, signal: ctl.signal, levels: `nivel ${lv} o ${Math.min(4, lv + 1)}` });
        r.accepted.forEach(q => { q.o_ = 'ia-alumno'; q.created = Date.now(); });
        accepted.push(...r.accepted);
        paint(`   ${r.accepted.length} aceptadas · ${r.rejected} descartadas en la validación`, Math.round(100 * (i + 1) / cs.length));
      }
    } catch (err) {
      this.busy = false; this.onModalClose = null;
      if (err && err.code === 'cancelled') return;
      const msg = { not_granted: 'Has decidido no permitir el uso de Claude en esta aplicación.', rate_limited: 'Has alcanzado el límite de uso de Claude por ahora. Inténtalo más tarde.', invalid_json: 'La respuesta no tenía el formato esperado. Vuelve a intentarlo.' }[err && err.code] || 'No se pudieron generar preguntas en este momento.';
      this.closeModal(); this.toast(msg); return;
    }
    this.busy = false; this.onModalClose = null; this.closeModal();
    if (!accepted.length) return this.toast('Ninguna pregunta nueva superó la validación. Prueba con las del banco o vuelve a intentarlo.');
    Store.gen.qs.push(...accepted); Catalog.gen = Store.gen.qs; Catalog.rebuild(); Store.saveGen();
    const qs = accepted.map(q => Catalog.byId.get(q.id)).filter(Boolean);
    this.startCustom(qs, 'errores', 'Preguntas nuevas sobre mis errores');
  }
};

/* ---------------------------------------------------------------------
   GRÁFICA DE EVOLUCIÓN (SVG, una serie, con tooltip)
   --------------------------------------------------------------------- */
const Charts = {
  mount() {
    const box = document.getElementById('evoChart'); if (!box) return;
    const H = Store.hist.quizzes.slice(-30);
    if (H.length < 2) return;
    const W = 640, Ht = 240, L = 40, R = 44, T = 14, B = 30;
    const x = i => L + (H.length === 1 ? (W - L - R) / 2 : i * (W - L - R) / (H.length - 1));
    const y = v => T + (100 - v) * (Ht - T - B) / 100;
    const pts = H.map((q, i) => [x(i), y(pct(q.ok, q.n)), q]);
    const grid = [0, 25, 50, 75, 100].map(v => `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)" stroke-width="1"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="var(--ink-3)" style="font-variant-numeric:tabular-nums">${v}%</text>`).join('');
    const line = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
    const area = `${line} L${pts[pts.length - 1][0].toFixed(1)} ${y(0)} L${pts[0][0].toFixed(1)} ${y(0)} Z`;
    const last = pts[pts.length - 1];
    const xl = [0, pts.length - 1].filter((v, i, a) => a.indexOf(v) === i).map(i => `<text x="${pts[i][0]}" y="${Ht - 8}" text-anchor="${i ? 'end' : 'start'}" font-size="11" fill="var(--ink-3)">${fmtShort(pts[i][2].t)}</text>`).join('');
    const hits = pts.map((p, i) => `<rect x="${p[0] - (W - L - R) / Math.max(1, pts.length - 1) / 2}" y="${T}" width="${(W - L - R) / Math.max(1, pts.length - 1)}" height="${Ht - T - B}" fill="transparent" data-i="${i}"/>`).join('');
    box.innerHTML = `<svg viewBox="0 0 ${W} ${Ht}" role="img" aria-label="Porcentaje de aciertos en tus últimos ${pts.length} entrenamientos; el último, ${pct(last[2].ok, last[2].n)} %">
      ${grid}<path d="${area}" fill="var(--chart)" opacity=".1"/><path d="${line}" fill="none" stroke="var(--chart)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      <circle id="evoDot" cx="${last[0]}" cy="${last[1]}" r="5" fill="var(--chart)" stroke="var(--surface)" stroke-width="2"/>
      <text x="${last[0] + 9}" y="${last[1] + 4}" font-size="12" font-weight="800" fill="var(--ink)">${pct(last[2].ok, last[2].n)}%</text>
      ${xl}<g id="evoHits">${hits}</g></svg><div class="tip" id="evoTip"></div>`;
    const tip = box.querySelector('#evoTip'), dot = box.querySelector('#evoDot'), svg = box.querySelector('svg');
    if (!tip || !dot || !svg) return;
    const show = i => { const p = pts[i]; const r = svg.getBoundingClientRect(); const sx = r.width / W; tip.innerHTML = `${fmtShort(p[2].t)} · ${esc(KINDS[p[2].kind] || '')} · <b>${p[2].ok}/${p[2].n} (${pct(p[2].ok, p[2].n)} %)</b>`; tip.style.left = p[0] * sx + 'px'; tip.style.top = p[1] * sx + 'px'; tip.classList.add('on'); dot.setAttribute('cx', p[0]); dot.setAttribute('cy', p[1]); };
    box.querySelectorAll('#evoHits rect').forEach(r => { r.addEventListener('mouseenter', () => show(+r.dataset.i)); r.addEventListener('touchstart', () => show(+r.dataset.i), { passive: true }); });
    svg.addEventListener('mouseleave', () => { tip.classList.remove('on'); dot.setAttribute('cx', last[0]); dot.setAttribute('cy', last[1]); });
  }
};

      for (const d of banks.docs) await Store.db.doc('bank/' + d.id).delete();

  /* ---------- Generación de banco con IA (RAG por fragmentos) ---------- */
  async runGen(n, mode) {
    if (!AI.available()) return UI.toast('La generación requiere abrir la aplicación en Claude.');
    if (this.running) return UI.toast('Ya hay una generación en curso.');
    const chunks = AI.chunks(n);
    if (!chunks.length) return UI.toast('El tema no tiene texto suficiente.');
    const ctl = new AbortController();
    const run = this.running = { n, done: 0, total: chunks.length, acc: 0, rej: 0, gen: 0, log: [], ctl };
    const paint = () => {
      UI.modal(`<div class="stack" style="gap:4px;flex:1"><span class="eyebrow">Banco de preguntas · Tema ${n}</span><b style="font-family:var(--f-display)">Recuperar fragmento → generar → validar</b></div>`,
        `<p class="small muted">Cada fragmento del tema se envía por separado. Las preguntas cuya fuente no aparece literalmente en el fragmento, o que no superan la auditoría (justificación, respuesta única, ambigüedad, explicación y nivel), se descartan.</p>
        <div class="progressbar"><i style="width:${pct(run.done, run.total)}%"></i></div>
        <div class="row small"><span><b>${run.done}/${run.total}</b> fragmentos</span><span><b>${run.acc}</b> aceptadas</span><span>${run.rej} descartadas</span></div>
        <div class="log">${run.log.slice(-80).map(esc).join('\n')}</div>`,
        `<button class="btn btn-ghost" data-act="a-stop">${run.finished ? 'Cerrar' : 'Detener'}</button>`);
      UI.onModalClose = () => { if (!run.finished) ctl.abort(); };
    };
    paint();
    const existing = Catalog.questions.filter(q => q.t[0] === n);
    const batchId = Date.now().toString(36);
    let buffer = [], concepts = {}, part = 0;
    const flush = async (force) => {
      while (buffer.length >= 50 || (force && buffer.length)) {
        const qs = buffer.splice(0, 50);
        const cs = {}; qs.forEach(q => { if (q._concept) cs[q.c] = q._concept; delete q._concept; });
        Object.assign(concepts, cs);
        try { await Store.write(`bank/t${n}-${batchId}-${part++}`, { t: n, qs, concepts: cs, created: Date.now(), source: 'ia', mode }); }
        catch (e) { run.log.push('Error al guardar: ' + (e && e.code)); }
      }
    };
    try {
      for (let i = 0; i < chunks.length; i += 2) {
        const pair = chunks.slice(i, i + 2);
        await Promise.all(pair.map(async ch => {
          ch.avoid = existing.filter(q => q.s === ch.s).map(q => q.q).slice(0, 12);
          const k = mode === 'more' ? 2 : clamp(Math.round(ch.text.length / 320), 2, 6);
          try {
            const r = await AI.generateValidated(ch, k, { prefix: 'b', signal: ctl.signal });
            run.acc += r.accepted.length; run.rej += r.rejected; buffer.push(...r.accepted);
            run.log.push(`${ch.title.slice(0, 60)} · +${r.accepted.length} (descartadas ${r.rejected})`);
          } catch (e) {
            if (e && ['cancelled', 'not_granted', 'sampling_disabled', 'rate_limited', 'session_expired'].includes(e.code)) throw e;
            run.log.push(`${ch.title.slice(0, 60)} · sin resultado (${(e && e.code) || 'error'})`);
          }
          run.done++; paint();
        }));
        await flush(false);
      }
      await flush(true);
      run.log.push(`Terminado: ${run.acc} preguntas nuevas validadas.`);
    } catch (e) {
      await flush(true);
      run.log.push(e && e.code === 'cancelled' ? 'Detenido. Las preguntas ya validadas se han guardado.' : `Interrumpido (${(e && e.code) || 'error'}). Las preguntas ya validadas se han guardado.`);
    }
    run.finished = true; this.running = null; paint();
  },

  /* ---------- Bloques mensuales ---------- */
  vBloques() {
    const m = this.monthsDraft || (this.monthsDraft = JSON.parse(JSON.stringify(Catalog.config.months || [])));
    const avail = Object.keys(Catalog.topics).map(Number).sort((a, b) => a - b);
    return `<div class="card"><p class="small muted" style="margin-bottom:14px">Cada bloque agrupa los temas trabajados en un mes. El alumnado puede hacer el simulacro del mes o el acumulativo, y seleccionar un bloque de un toque al configurar su práctica.</p>
      <div class="stack" style="gap:12px">${m.map((x, i) => `<div class="slot" style="grid-template-columns:1fr auto"><div class="stack" style="gap:8px"><input data-mname="${i}" value="${esc(x.name)}" aria-label="Nombre del bloque" style="border:1.5px solid var(--line-strong);border-radius:10px;padding:8px 10px;font-weight:800;max-width:320px">
        <div class="filterbar">${Array.from({ length: TOTAL_TOPICS }, (_, k) => k + 1).map(n => `<button class="fchip" data-act="a-mtog" data-i="${i}" data-n="${n}" aria-pressed="${x.topics.includes(n)}" ${avail.includes(n) || x.topics.includes(n) ? '' : 'style="opacity:.45"'}>T${n}</button>`).join('')}</div></div>
        <button class="btn btn-quiet btn-sm" data-act="a-mdel" data-i="${i}">${ICON.trash} Quitar</button></div>`).join('')}</div>
      <div class="row" style="margin-top:16px"><button class="btn btn-ghost" data-act="a-madd">Añadir bloque</button><span class="spacer"></span><button class="btn btn-primary" data-act="a-msave" ${this.canWrite() ? '' : 'disabled'}>Guardar bloques</button></div></div>`;
  },

  /* ---------- Banco ---------- */
  vBanco() {
    const act = Object.keys(Catalog.topics).map(Number).sort((a, b) => a - b);
    const all = Catalog.questions.filter(q => !q.id.startsWith('g-'));
    const f = this.qf;
    let list = all.filter(q => (!f.t || q.t.includes(f.t)) && (!f.l || q.l === f.l) && (!f.y || q.y === f.y) && (!f.s || normQ(q.q + ' ' + q.e).toLowerCase().includes(f.s.toLowerCase())));
    const disabled = Catalog.config.disabledQ || [];
    const rej = Catalog.rejected.filter(r => r.origin !== 'ia-alumno');
    return `<div class="card"><div class="tablewrap"><table class="t"><thead><tr><th>Tema</th><th style="text-align:right">Total</th>${[1, 2, 3, 4].map(l => `<th style="text-align:right">${LEVELS[l]}</th>`).join('')}<th>Tipos</th><th></th></tr></thead><tbody>
      ${act.map(n => { const qs = all.filter(q => q.t[0] === n); const ty = {}; qs.forEach(q => ty[q.y] = (ty[q.y] || 0) + 1); return `<tr><td><b>Tema ${n}</b></td><td class="num">${qs.length}</td>${[1, 2, 3, 4].map(l => `<td class="num">${qs.filter(q => q.l === l).length}</td>`).join('')}<td class="small">${Object.entries(ty).map(([k, v]) => `${k.toUpperCase()} ${v}`).join(' · ')}</td><td><button class="btn btn-ghost btn-sm" data-act="a-gen" data-n="${n}" ${AI.available() && this.canWrite() ? '' : 'disabled'}>${ICON.spark} Ampliar con IA</button></td></tr>`; }).join('')}
      </tbody></table></div><p class="small muted" style="margin-top:10px">U única · M múltiple · V verdadero/falso · N detectar la incorrecta · R relacionar · C completar. «Ampliar con IA» recorre el tema por fragmentos y añade solo las preguntas que superan la validación.</p></div>
      ${disabled.length ? `<p class="small muted">${disabled.length} preguntas retiradas manualmente.</p>` : ''}
      ${rej.length ? `<details class="card"><summary class="h3" style="cursor:pointer">Preguntas descartadas por la validación automática (${rej.length})</summary><div class="stack small" style="gap:8px;margin-top:12px">${rej.slice(0, 60).map(r => `<div><b>T${(r.t || []).join('+')}</b> · ${esc(r.reason)} — <span class="muted">${esc((r.q || '').slice(0, 140))}</span></div>`).join('')}</div></details>` : ''}
      <div class="card"><div class="row" style="margin-bottom:12px">
        <select id="qfT" class="btn btn-ghost btn-sm"><option value="0">Todos los temas</option>${act.map(n => `<option value="${n}" ${f.t === n ? 'selected' : ''}>Tema ${n}</option>`).join('')}</select>
        <select id="qfL" class="btn btn-ghost btn-sm"><option value="0">Todos los niveles</option>${[1, 2, 3, 4].map(l => `<option value="${l}" ${f.l === l ? 'selected' : ''}>${LEVELS[l]}</option>`).join('')}</select>
        <select id="qfY" class="btn btn-ghost btn-sm"><option value="">Todos los tipos</option>${Object.entries(TYPES).map(([k, v]) => `<option value="${k}" ${f.y === k ? 'selected' : ''}>${v}</option>`).join('')}</select>
        <input id="qfS" value="${esc(f.s)}" placeholder="Buscar…" style="border:1.5px solid var(--line-strong);border-radius:10px;padding:7px 10px;min-width:0;flex:1">
        <span class="small muted">${list.length} preguntas</span></div>
        <div class="review">${list.slice(0, 40).map(q => `<details class="ritem"><summary><span class="ic un" style="background:var(--amber);color:#1B1712">${q.y.toUpperCase()}</span><span class="rq">${esc(q.q.replace('[NO]', 'NO'))}</span><span class="small muted">T${q.t.join('+')} · ${LEVELS[q.l]}</span></summary>
          <div class="rb"><div class="fb-row"><span class="lbl">Respuesta correcta</span><div>${esc(Engine.answerText(q, 'correct'))}</div></div>${q.o ? `<div class="small muted">Opciones: ${q.o.map(esc).join(' · ')}</div>` : ''}
          <div class="explain">${ICON.bulb}<div>${esc(q.e)}</div></div>
          <div class="small"><span class="muted">Fuente:</span> «${esc(q.f[0].x)}»</div>
          <div class="row small muted"><span>${esc(Catalog.conceptLabel(q.c))}</span><span>${esc(CATS[q.k])}</span><span>${q.id.startsWith('b-') ? 'Generada con IA · validada' : 'Banco base'}</span><span class="spacer"></span><button class="linkbtn" data-act="source" data-q="${q.id}">Ver en el tema</button><button class="btn btn-quiet btn-sm" data-act="a-disable" data-id="${q.id}" ${this.canWrite() ? '' : 'disabled'}>Retirar pregunta</button></div></div></details>`).join('')}</div>
        ${list.length > 40 ? `<p class="small muted" style="margin-top:10px">Mostrando 40 de ${list.length}. Afina el filtro para ver otras.</p>` : ''}</div>`;
  },

  /* ---------- Estadísticas agregadas ---------- */
  vStats() {
    if (!Store.db) return `<div class="empty">Las estadísticas de uso están disponibles al abrir la aplicación publicada en Claude.</div>`;
    const d = this.statsData;
    if (!d) { this.loadStats(); return `<div class="empty">Cargando estadísticas…</div>`; }
    if (d.error) return `<div class="notice bad">${ICON.alert}<div>${esc(d.error)}</div></div>`;
    const A = d.agg;
    const bars = (rows, fmt) => rows.length ? `<div class="bars">${rows.map(r => `<div class="bar"><span class="lab" title="${esc(r.label)}">${esc(r.label)}</span><div class="track"><div class="fill" style="width:${r.w}%"></div></div><span class="val">${fmt(r)}</span></div>`).join('')}</div>` : '<p class="small muted">Sin datos suficientes todavía.</p>';
    const maxN = Math.max(1, ...A.topics.map(t => t.n));
    return `<p class="small muted">Datos agregados y anónimos de ${plural(A.users, 'opositor', 'opositores')}. No se muestran resultados individuales ni clasificaciones.</p>
      <div class="kpis"><div class="kpi"><div class="v">${A.users}</div><div class="l">opositores con actividad</div></div><div class="kpi"><div class="v">${A.active7}</div><div class="l">activos en los últimos 7 días</div></div><div class="kpi"><div class="v">${A.nq}</div><div class="l">cuestionarios realizados</div></div><div class="kpi"><div class="v">${A.na}</div><div class="l">preguntas respondidas</div></div><div class="kpi"><div class="v">${A.na ? pct(A.ok, A.na) + ' %' : '—'}</div><div class="l">aciertos globales</div></div><div class="kpi"><div class="v">${A.hc}</div><div class="l">errores con seguridad alta</div></div></div>
      <div class="grid2">
        <div class="card"><span class="eyebrow">Temas más entrenados</span><div style="margin-top:14px">${bars(A.topics.slice().sort((a, b) => b.n - a.n).map(t => ({ label: 'Tema ' + t.t, w: pct(t.n, maxN), v: t.n })), r => r.v)}</div></div>
        <div class="card"><span class="eyebrow">Temas que generan más errores</span><div style="margin-top:14px">${bars(A.topics.filter(t => t.n >= 10).sort((a, b) => b.err - a.err).map(t => ({ label: 'Tema ' + t.t, w: t.err, v: t.err })), r => r.v + ' %')}</div></div>
        <div class="card"><span class="eyebrow">Conceptos con mayor porcentaje de fallos</span><div style="margin-top:14px">${bars(A.concepts.slice(0, 10).map(c => ({ label: Catalog.conceptLabel(c.c) + ' (T' + ((Catalog.concepts[c.c] || {}).t || '?') + ')', w: c.err, v: c.err, n: c.n })), r => r.v + ' %')}</div><p class="small muted" style="margin-top:8px">Solo conceptos con al menos 8 respuestas.</p></div>
        <div class="card"><span class="eyebrow">Distribución de errores por categoría</span><div style="margin-top:14px">${bars(A.cats.slice(0, 10).map(c => ({ label: `T${c.t} · ${CATS[c.k] || c.k}`, w: c.err, v: c.err })), r => r.v + ' %')}</div></div>
      </div>
      <div class="card"><span class="eyebrow">Preguntas especialmente difíciles</span><div class="tablewrap" style="margin-top:12px"><table class="t"><thead><tr><th>Pregunta</th><th>Tema</th><th>Nivel</th><th style="text-align:right">Respuestas</th><th style="text-align:right">Fallos</th></tr></thead><tbody>
        ${A.hard.slice(0, 15).map(h => { const q = Catalog.byId.get(h.id); return q ? `<tr><td>${esc(q.q.replace('[NO]', 'NO'))}</td><td>${q.t.join('+')}</td><td>${LEVELS[q.l]}</td><td class="num">${h.n}</td><td class="num">${h.err} %</td></tr>` : ''; }).join('') || '<tr><td colspan="5" class="muted">Sin datos suficientes (mínimo 5 respuestas por pregunta).</td></tr>'}
      </tbody></table></div><p class="small muted" style="margin-top:8px">Útil para detectar contenidos que conviene volver a explicar en clase.</p></div>
      <div class="row"><button class="btn btn-ghost btn-sm" data-act="a-reload-stats">Actualizar</button></div>`;
  },
  async loadStats() {
    try {
      const snap = await Store.db.collection('stats').limit(1000).get();
      const A = { users: 0, active7: 0, nq: 0, na: 0, ok: 0, hc: 0, tp: {}, q: {}, cc: {}, kc: {} };
      const now = today();
      snap.docs.forEach(d => {
        const s = d.data() || {}; if (!s.na) return;
        A.users++; if (now - (s.lastDay || 0) <= 7) A.active7++;
        A.nq += s.nq || 0; A.na += s.na || 0; A.ok += s.ok || 0; A.hc += s.hc || 0;
        const add = (dst, src) => Object.entries(src || {}).forEach(([k, v]) => { const x = dst[k] || (dst[k] = [0, 0]); x[0] += v[0]; x[1] += v[1]; });
        add(A.tp, s.tp); add(A.q, s.q); add(A.cc, s.cc); add(A.kc, s.kc);
      });
      A.topics = Object.entries(A.tp).map(([t, v]) => ({ t, n: v[0], err: pct(v[1], v[0]) }));
      A.concepts = Object.entries(A.cc).filter(([, v]) => v[0] >= 8).map(([c, v]) => ({ c, n: v[0], err: pct(v[1], v[0]) })).sort((a, b) => b.err - a.err);
      A.cats = Object.entries(A.kc).filter(([, v]) => v[0] >= 8).map(([k, v]) => { const [t, c] = k.split('|'); return { t, k: c, err: pct(v[1], v[0]) }; }).sort((a, b) => b.err - a.err);
      A.hard = Object.entries(A.q).filter(([, v]) => v[0] >= 5).map(([id, v]) => ({ id, n: v[0], err: pct(v[1], v[0]) })).sort((a, b) => b.err - a.err);
      this.statsData = { agg: A, at: Date.now() };
    } catch (e) { this.statsData = { error: 'No se pudieron leer las estadísticas (' + ((e && e.code) || 'error') + ').' }; }
    if (UI.route === 'preparador' && this.tab === 'stats') UI.render();
  },

  /* ---------- Documentación del diseño ---------- */
  vDiseno() { return `<div class="card doc-design">${DESIGN_DOC}</div>`; },

  onChange(e) {
    const id = e.target.id, v = e.target.value;
    if (id === 'aFile') { const f = e.target.files[0]; if (f) this.onFile(f); }
    else if (id === 'qfT') { this.qf.t = +v; UI.render(); }
    else if (id === 'qfL') { this.qf.l = +v; UI.render(); }
    else if (id === 'qfY') { this.qf.y = v; UI.render(); }
  },
  onInput(e) {
    if (e.target.id === 'qfS') { this.qf.s = e.target.value; clearTimeout(this._st); this._st = setTimeout(() => { UI.render(); const i = document.getElementById('qfS'); if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); } }, 350); }
    else if (e.target.dataset.mname !== undefined && this.monthsDraft) this.monthsDraft[+e.target.dataset.mname].name = e.target.value;
  },

  actions: {
    atab(el) { this.tab = el.dataset.v; this.confirm = null; if (this.tab === 'stats') this.statsData = null; if (this.tab === 'bloques') this.monthsDraft = null; UI.render(); },
    'a-toggle'(el) { const n = +el.dataset.n; const c = JSON.parse(JSON.stringify(Catalog.config.topics || {})); c[n] = Object.assign({}, c[n], { active: !Catalog.active(n) }); this.saveConfig({ topics: c }); },
    'a-upload'(el) { this.openUpload(+el.dataset.n); },
    'a-askdel'(el) { this.confirm = 'del' + el.dataset.n; UI.render(); },
    'a-cancel'() { this.confirm = null; UI.render(); },
    'a-delete'(el) { this.deleteTopic(+el.dataset.n); },
    'a-restore'(el) { const n = +el.dataset.n; const c = JSON.parse(JSON.stringify(Catalog.config.topics || {})); c[n] = Object.assign({}, c[n], { removed: false }); this.saveConfig({ topics: c }); },
    'a-merge'(el) { const p = this.draft.parsed, i = +el.dataset.i; document.querySelectorAll('[data-sec]').forEach(inp => { const s = p.sections[+inp.dataset.sec]; if (s) s.title = inp.value; }); const prev = p.sections[i - 1], cur = p.sections[i]; prev.blocks.push({ k: 'h', t: cur.title }, ...cur.blocks); p.sections.splice(i, 1); this.paintUpload(); },
    'a-save'() { this.saveTopic(false); },
    'a-save-gen'() { this.saveTopic(true); },
    'a-gen'(el) { this.runGen(+el.dataset.n, 'more'); },
    'a-stop'() { UI.closeModal(); },
    'a-disable'(el) { const d = uniq((Catalog.config.disabledQ || []).concat(el.dataset.id)); this.saveConfig({ disabledQ: d }); },
    'a-mtog'(el) { const m = this.monthsDraft[+el.dataset.i], n = +el.dataset.n; const k = m.topics.indexOf(n); if (k >= 0) m.topics.splice(k, 1); else { m.topics.push(n); m.topics.sort((a, b) => a - b); } UI.render(); },
    'a-madd'() { const m = this.monthsDraft; m.push({ id: uid('m'), name: `Mes ${m.length + 1}`, topics: [] }); UI.render(); },
    'a-mdel'(el) { this.monthsDraft.splice(+el.dataset.i, 1); UI.render(); },
    'a-msave'() { document.querySelectorAll('[data-mname]').forEach(i => { this.monthsDraft[+i.dataset.mname].name = i.value.trim() || 'Bloque'; }); this.saveConfig({ months: this.monthsDraft.filter(m => m.topics.length) }); this.monthsDraft = null; },
    'a-reload-stats'() { this.statsData = null; UI.render(); }
  }
};

const DESIGN_DOC = `
<span class="eyebrow">Diseño del sistema</span>
<h2 class="h2" style="margin-top:6px">Cómo funciona Entrena tu temario</h2>
<p>Documentación técnica para el preparador: arquitectura, datos, generación y validación de preguntas, índice de dominio, memoria a largo plazo y privacidad.</p>

<h3>1. Arquitectura funcional</h3>
<ul>
<li><b>Aplicación web de una sola página</b> publicada como artefacto de Claude. Funciona en ordenador y móvil.</li>
<li><b>Catálogo</b>: temas base (incluidos en la aplicación) + temas subidos por el preparador (base de datos). Un tema subido con el mismo número sustituye al base.</li>
<li><b>Banco</b>: banco base redactado y verificado a partir de los documentos + preguntas generadas con IA por el preparador + preguntas nuevas que genera cada opositor sobre sus errores (privadas).</li>
<li><b>Motor</b>: selección de preguntas, corrección, índice de dominio, repetición espaciada, cuaderno de errores, recomendaciones y análisis personal.</li>
<li><b>Persistencia</b>: progreso privado por usuario en la base de datos de la aplicación; copia en el navegador como respaldo.</li>
</ul>

<h3>2. Estructura de datos</h3>
<pre>catalog/config            meses, estado de cada tema (activo, retirado), preguntas retiradas
topics/t{n}               tema subido: número, título, archivo, fecha, palabras, apartados → bloques
bank/t{n}-{lote}-{k}      preguntas generadas y validadas (≤ 50 por documento) + conceptos
data/users/{id}/state     progreso privado: preguntas, temas, categorías, memoria, errores
data/users/{id}/hist      historial de cuestionarios (resúmenes) y detalle de los últimos
data/users/{id}/gen       preguntas nuevas creadas con IA sobre los errores del opositor
stats/{id}                agregados anónimos para el panel del preparador</pre>
<p>Cada pregunta guarda: <code>id</code>, temas, apartado, <b>concepto</b>, <b>categoría</b>, nivel (1-4), tipo, enunciado, opciones, solución, explicación y <b>fragmentos fuente literales</b> (tema, apartado, bloque y texto).</p>

<h3>3. Usuarios y privacidad</h3>
<ul>
<li>Cada opositor se identifica con su cuenta de Claude. Su progreso vive en <code>data/users/{id}</code>, que solo puede leer y escribir él (ni siquiera el autor).</li>
<li>El panel del preparador solo lee <code>stats/{id}</code>: contadores anónimos agregados. No hay rankings ni comparaciones entre opositores.</li>
<li>Para guardar en la nube, cada opositor necesita acceso de colaborador a la aplicación. Sin ese permiso, el progreso se guarda en su navegador y puede descargar y restaurar una copia de seguridad.</li>
</ul>

<h3>4. Carga y procesamiento documental</h3>
<ul>
<li>Word (.docx) con mammoth y PDF con pdf.js, en el propio navegador.</li>
<li>Se detectan número y título del tema, se descarta el índice y se identifican apartados (numeración, estilos de título, negritas, introducción, conclusión y bibliografía). El preparador revisa y corrige los títulos antes de guardar.</li>
<li>El contenido se guarda como apartados y bloques (párrafos, listas y subtítulos) sin alterar el texto.</li>
</ul>

<h3>5. Arquitectura RAG</h3>
<p>Proceso obligatorio: <b>recuperar información → generar pregunta</b>, nunca al revés.</p>
<ol>
<li>Se identifican los temas seleccionados y solo se accede a sus documentos.</li>
<li>Se trocea cada apartado en fragmentos de hasta 1.500 caracteres (sin bibliografía).</li>
<li>Para cada fragmento se pide a Claude que localice la frase que justifica la respuesta y que redacte la pregunta, las alternativas, la solución y la explicación <b>usando solo ese fragmento</b>.</li>
<li>Cada pregunta debe devolver su <b>fuente literal</b>; si no aparece carácter a carácter en el fragmento, se descarta.</li>
<li>Para repasar errores, la recuperación toma los bloques fuente de las preguntas falladas y sus vecinos.</li>
</ol>

<h3>6. Motor de generación y validación</h3>
<ul>
<li><b>Validación estructural</b> (siempre, también en el banco base): fuente literal en el tema, una única solución, opciones sin repetir, sin «todas/ninguna de las anteriores», hueco en «completar», marca NO en «detectar la incorrecta», parejas únicas en «relacionar», explicación y nivel presentes.</li>
<li><b>Auditoría con IA</b> (preguntas generadas): una segunda llamada, solo con el fragmento, comprueba que la respuesta es justificable, que ninguna otra opción es correcta, que no hay ambigüedad, que los distractores son plausibles, que la explicación coincide y estima el nivel. Si el nivel se desvía más de uno, se descarta.</li>
<li>Las preguntas que no superan la validación nunca se muestran y aparecen en «Banco de preguntas → descartadas».</li>
<li>Calidad del banco base: 437 preguntas, 6 tipos, 4 niveles, 12 intertemas; la opción correcta es la más larga solo en el 29 % de los casos y las posiciones se barajan en cada intento.</li>
</ul>

<h3>7. Selección de preguntas</h3>
<ul>
<li>Reparto equilibrado entre temas (resto al tema con más disponibilidad) o <b>distribución inteligente</b>: más peso a temas con menor dominio, más errores pendientes y más contenidos en riesgo de olvido.</li>
<li>Se prioriza lo no visto, se evita lo de los dos últimos cuestionarios y dos preguntas seguidas del mismo concepto. En mixto: 20 % básico, 35 % intermedio, 30 % avanzado y 15 % experto, con dificultad creciente.</li>
<li>Nunca se repiten preguntas para completar el número pedido: se informa y se ofrece hacer las disponibles o completar con niveles próximos.</li>
</ul>

<h3>8. Índice de dominio</h3>
<pre>peso      = dificultad (0,7 · 1 · 1,3 · 1,6) × (1,3 si error con seguridad alta; 0,6 si sin responder)
puntuación= acierto con seguridad alta 1 · media 0,92 · baja 0,75 · sin indicar 0,92 ; error 0
A         = 55 % aciertos ponderados acumulados + 45 % últimas 30 respuestas
M1        = (A·Σpeso + 0,35·12) / (Σpeso + 12)          ← evita dominios con muestras pequeñas
M2        = M1 × (0,75 + 0,25 × cobertura de conceptos del tema)
olvido    = 1 hasta 10 días; después −0,6 % por día (máx. −20 %)
índice    = 100 × M2 × olvido − 2 por error reincidente pendiente + 0,5 por error superado</pre>
<p>Estados: <b>sin datos</b> (menos de 12 respuestas) · <b>dominado</b> (≥ 75 y al menos 30 respuestas) · <b>en consolidación</b> (50-74) · <b>necesita refuerzo</b> (&lt; 50). Ejemplo: 9/10 básicas ≈ 55 %; 85 % tras 150 preguntas de varios niveles ≈ 80 %. El tiempo de respuesta no se usa.</p>

<h3>9. Memoria a largo plazo y repetición espaciada</h3>
<ul>
<li>Cada concepto tiene intervalo, facilidad y fecha de próxima revisión. Acierto: 2 días, 6 días y después intervalo × facilidad (menos si fue con seguridad baja). Error: vuelve a 1 día y baja la facilidad (más si fue con seguridad alta).</li>
<li>Prioridad de recuperación: errores pendientes, reincidentes y con seguridad alta, contenidos vencidos, categorías débiles y contenidos dominados que llevan 21 días sin aparecer.</li>
<li>Un tema dominado sin entrenar en 21 días pasa a «repaso recomendado»: no se da por olvidado, se propone comprobarlo.</li>
</ul>

<h3>10. Cuaderno de errores</h3>
<ul>
<li>Cada fallo guarda pregunta, respuesta elegida, correcta, explicación, tema, apartado, concepto, categoría, nivel, seguridad, veces y fecha.</li>
<li>Estados por concepto: <b>pendiente → en consolidación → superado</b>. Para superarlo hay que acertar al menos dos preguntas distintas del mismo contenido, y al menos una diferente de las falladas.</li>
<li>Reincidente: tres o más fallos en el mismo concepto. Sube de prioridad en los repasos, sobre todo si hubo seguridad alta.</li>
</ul>

<h3>11. Analítica individual</h3>
<p>El análisis personal solo afirma lo que respaldan los datos: temas que mejoran (rendimiento reciente ≥ 8 puntos sobre el acumulado), mejores y peores categorías con muestra suficiente, errores reincidentes, proporción de aciertos con seguridad baja y errores con seguridad alta.</p>

<h3>12. Modos de entrenamiento</h3>
<p>Practicar (configurable) · Repaso de hoy · Repasar mis errores (volver a intentar / preguntas diferentes / preguntas nuevas con IA) · Puntos débiles · Entrenar un tema · Reto de 5 · Simulacro del mes · Simulacro acumulativo. Aprendizaje (corrección inmediata con fuente) o examen (corrección al final).</p>

<h3>13. Hoja de ruta</h3>
<ul>
<li>Revisión humana opcional de las preguntas generadas antes de publicarlas.</li>
<li>Almacenar el archivo original de cada tema junto a su versión procesada.</li>
<li>Informe mensual para el preparador con los contenidos que más errores generan.</li>
</ul>`;

<script>
/* =====================================================================
   EDICIÓN WEB — acceso con código de clase y perfil del dispositivo.
   El temario y las preguntas viajan cifrados (AES-GCM, clave PBKDF2):
   sin el código de clase no se pueden leer.
   ===================================================================== */
(function () {
  'use strict';
  var ENC = JSON.parse(document.getElementById('enc').textContent);
  var view = document.getElementById('view');
  var KEY = 'ett.v1.key';
  var b64 = function (s) { var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; };
  var ub64 = function (u) { var s = ''; u = new Uint8Array(u); for (var i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s); };
  var escH = function (s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var norm = function (c) { return String(c || '').toUpperCase().replace(/[^A-Z0-9]/g, ''); };
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) { } }

  function decrypt(key) {
    return crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(ENC.iv) }, key, b64(ENC.ct)).then(function (buf) { return new TextDecoder().decode(buf); });
  }
  function derive(code) {
    return crypto.subtle.importKey('raw', new TextEncoder().encode(norm(code)), 'PBKDF2', false, ['deriveKey']).then(function (base) {
      return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(ENC.salt), iterations: ENC.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
    });
  }

  function gate(msg) {
    view.innerHTML = '<div class="wrap"><div class="gate card lift">' +
      '<span class="eyebrow">Acceso del alumnado</span>' +
      '<h1 class="h2">Introduce el código de acceso</h1>' +
      '<p class="muted">Es el código del mes que compartimos en el grupo de WhatsApp de la academia. En cada dispositivo solo tendrás que escribirlo una vez al mes.</p>' +
      '<form id="gateForm" class="stack" style="gap:12px" novalidate>' +
      '<label class="field" for="gateCode">Código de acceso<input id="gateCode" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="MIGUEL-LUMEN-…" required></label>' +
      (msg ? '<div class="notice bad" role="alert"><div>' + escH(msg) + '</div></div>' : '') +
      '<button class="btn btn-accent btn-lg" type="submit" id="gateBtn">Entrar</button></form>' +
      '<p class="small muted">Tu progreso se guardará solo en este dispositivo. No hace falta crear ninguna cuenta.</p></div></div>';
    var f = document.getElementById('gateForm'), inp = document.getElementById('gateCode'), btn = document.getElementById('gateBtn');
    inp.focus();
    f.addEventListener('submit', function (e) {
      e.preventDefault();
      if (!norm(inp.value)) return;
      btn.disabled = true; btn.textContent = 'Comprobando…';
      var key;
      derive(inp.value).then(function (k) { key = k; return decrypt(k); }).then(function (text) {
        return crypto.subtle.exportKey('raw', key).then(function (raw) { lsSet(KEY, ub64(raw)); return text; });
      }).then(ready).catch(function () { gate('Ese código no es correcto o ya no está vigente. Revisa el código de este mes en el grupo de la academia.'); });
    });
  }

  function profiles() { try { return JSON.parse(lsGet('ett.v1.profiles') || '[]'); } catch (e) { return []; } }

  function ready(text) {
    var list = profiles(), cur = lsGet('ett.v1.current');
    var p = list.filter(function (x) { return x.id === cur; })[0] || list[0];
    if (p) return start(text, p);
    view.innerHTML = '<div class="wrap"><div class="gate card lift">' +
      '<span class="eyebrow">Tu perfil</span><h1 class="h2">¿Cómo te llamas?</h1>' +
      '<p class="muted">Tu nombre o un alias. Sirve para separar tu progreso si compartes este dispositivo con otra persona.</p>' +
      '<form id="pForm" class="stack" style="gap:12px" novalidate><label class="field" for="pName">Nombre o alias<input id="pName" maxlength="40" autocomplete="given-name" required style="text-transform:none;letter-spacing:0"></label>' +
      '<button class="btn btn-primary btn-lg" type="submit">Empezar a entrenar</button></form></div></div>';
    var f = document.getElementById('pForm'), inp = document.getElementById('pName'); inp.focus();
    f.addEventListener('submit', function (e) {
      e.preventDefault();
      var name = inp.value.trim().slice(0, 40); if (!name) return;
      var np = { id: 'u' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7), name: name, created: Date.now() };
      list.push(np); lsSet('ett.v1.profiles', JSON.stringify(list)); lsSet('ett.v1.current', np.id);
      if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function () { });
      start(text, np);
    });
  }

  function start(text, p) {
    lsSet('ett.v1.current', p.id);
    window.__SEED_JSON__ = text; window.__PROFILE__ = p;
    try { window.__startApp(); } catch (e) { view.innerHTML = '<div class="wrap"><div class="notice bad"><div>No se pudo iniciar la aplicación. Recarga la página.</div></div></div>'; throw e; }
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function () { });
  }

  if (!window.crypto || !crypto.subtle) { view.innerHTML = '<div class="wrap"><div class="notice bad"><div>Este navegador no permite abrir la aplicación. Ábrela con una versión reciente de Chrome, Safari, Edge o Firefox.</div></div></div>'; return; }
  var saved = lsGet(KEY);
  if (saved) {
    crypto.subtle.importKey('raw', b64(saved), { name: 'AES-GCM' }, false, ['decrypt']).then(decrypt).then(ready).catch(function () { try { localStorage.removeItem(KEY); } catch (e) { } gate('El código de acceso ha cambiado este mes. Escribe el nuevo: lo tienes en el grupo de WhatsApp de la academia. Tu progreso sigue guardado.'); });
  } else gate();

  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    window.addEventListener('load', function () { navigator.serviceWorker.register('./sw.js').catch(function () { }); });
  }
})();
</script>
