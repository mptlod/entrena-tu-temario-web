  },

  normalize(raw, ctx, prefix, fixedConcept) {
    const out = [], chunkN = normQ(ctx.text);
    (Array.isArray(raw) ? raw : []).forEach(r => {
      if (!r || typeof r !== 'object') return;
      const y = String(r.tipo || '').trim();
      const q = {
        t: [ctx.t], s: ctx.s, y, l: clamp(parseInt(r.nivel, 10) || 2, 1, 4),
        k: CATS[r.categoria] ? r.categoria : 'conceptos',
        q: String(r.enunciado || '').trim(), e: String(r.explicacion || '').trim(),
        f: [{ t: ctx.t, s: ctx.s, x: String(r.fuente || '').trim() }]
      };
      if (!normQ(q.f[0].x) || !chunkN.includes(normQ(q.f[0].x))) return; // la fuente debe ser literal
      if (y === 'u' || y === 'c' || y === 'n') { q.o = (r.opciones || []).map(String); q.a = parseInt(r.correcta, 10); }
      else if (y === 'm') { q.o = (r.opciones || []).map(String); q.a = (r.correctas || []).map(x => parseInt(x, 10)).filter(Number.isInteger).sort(); }
      else if (y === 'v') q.a = r.correcta === true || r.correcta === 'true';
      else if (y === 'r') q.p = (r.parejas || []).filter(p => Array.isArray(p) && p.length === 2).map(p => [String(p[0]), String(p[1])]);
      else return;
      if (y === 'n' && !q.q.includes('[NO]')) q.q = q.q.replace(/\bNO\b/, '[NO]');
      if (y === 'c' && !q.q.includes('____')) q.q = q.q.replace(/_{2,}/, '____');
      const label = String(r.concepto || '').trim().slice(0, 80) || ctx.title;
      q.c = fixedConcept || `t${ctx.t}-${slug(label) || 'contenido'}`;
      q._concept = fixedConcept ? null : { label: label.charAt(0).toUpperCase() + label.slice(1), t: ctx.t };
      q.id = `${prefix}-${ctx.t}-${hashStr(q.q + JSON.stringify(q.o || q.p || q.a))}`;
      const v = validateQuestion(Object.assign({}, q, { f: q.f.slice() }), Catalog.topics);
      if (v.ok) out.push(q);
    });
    return out;
  },

  async generateValidated(ctx, k, opts = {}) {
    const sample = Store.sample; if (!sample) throw { code: 'not_granted' };
    const raw = await sample.json(this.genPrompt(ctx, k, opts), { modelTier: 'default', cache: false, signal: opts.signal });
    let qs = this.normalize(raw, ctx, opts.prefix || 'b', opts.concept);
    const generated = Array.isArray(raw) ? raw.length : 0;
    if (!qs.length) return { accepted: [], generated, rejected: generated };
    const verdict = await sample.json(this.auditPrompt(ctx, qs), { modelTier: 'default', cache: false, signal: opts.signal });
    const byId = new Map((Array.isArray(verdict) ? verdict : []).map(v => [parseInt(v.id, 10), v]));
    const accepted = [];
    qs.forEach((q, i) => {
      const v = byId.get(i); if (!v) return;
      const lvl = parseInt(v.nivel_estimado, 10);
      if (v.justificable === true && v.unica === true && v.ambigua === false && v.explicacion === true && v.distractores !== false && Math.abs((lvl || q.l) - q.l) <= 1) {
        if (lvl >= 1 && lvl <= 4) q.l = lvl;
        q.v_ = { at: Date.now(), by: 'auditoría automática' };
        accepted.push(q);
      }
    });
    return { accepted, generated, rejected: generated - accepted.length };
  }
};
function hashStr(s) { let h = 5381; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) >>> 0; return h.toString(36); }

   PROCESAMIENTO DOCUMENTAL: Word (mammoth) y PDF (pdf.js) → apartados
   --------------------------------------------------------------------- */
const Docs = {
  loadScript(src) {
    return new Promise((res, rej) => { if (document.querySelector(`script[src="${src}"]`)) return res(); const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('No se pudo cargar ' + src)); document.head.appendChild(s); });
  },
  async parse(file) {
    const buf = await file.arrayBuffer();
    const name = file.name.toLowerCase();
    let blocks;
    if (name.endsWith('.docx')) blocks = await this.fromDocx(buf);
    else if (name.endsWith('.pdf')) blocks = await this.fromPdf(buf);
    else throw new Error('Formato no admitido. Usa un documento Word (.docx) o PDF.');
    return this.structure(blocks, file);
  },
  async fromDocx(buf) {
    await this.loadScript('https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.8.0/mammoth.browser.min.js');
    const r = await window.mammoth.convertToHtml({ arrayBuffer: buf });
    const doc = new DOMParser().parseFromString(r.value, 'text/html');
    const out = [];
    const txt = el => el.textContent.replace(/\s+/g, ' ').trim();
    const allBold = el => { const t = txt(el); if (!t) return false; const b = Array.from(el.querySelectorAll('strong,b')).map(x => x.textContent).join('').replace(/\s+/g, ' ').trim(); return b.length >= t.length * 0.9; };
    const walkList = (list, lvl) => Array.from(list.children).forEach(li => {
      const clone = li.cloneNode(true); clone.querySelectorAll('ul,ol').forEach(x => x.remove());
      const t = txt(clone); if (t) out.push({ t, li: lvl, bold: allBold(clone), listed: true });
      li.querySelectorAll(':scope > ul, :scope > ol').forEach(sub => walkList(sub, lvl + 1));
    });
    Array.from(doc.body.children).forEach(el => {
      const tag = el.tagName.toLowerCase();
      if (/^h[1-6]$/.test(tag)) { const t = txt(el); if (t) out.push({ t, heading: +tag[1] }); }
      else if (tag === 'p') { const t = txt(el); if (t) out.push({ t, bold: allBold(el) }); }
      else if (tag === 'ul' || tag === 'ol') walkList(el, 0);
      else if (tag === 'table') el.querySelectorAll('tr').forEach(tr => { const t = Array.from(tr.children).map(txt).filter(Boolean).join(' · '); if (t) out.push({ t }); });
    });
    return out;
  },
  async fromPdf(buf) {
    await this.loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');
    await this.loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js');
    const lib = window.pdfjsLib;
    const pdf = await lib.getDocument({ data: new Uint8Array(buf), isEvalSupported: false }).promise;
    const lines = [];
    for (let p = 1; p <= pdf.numPages; p++) {
      const page = await pdf.getPage(p);
      const tc = await page.getTextContent();
      const rows = [];
      tc.items.forEach(it => {
        if (!it.str || !it.str.trim()) return;
        const y = Math.round(it.transform[5]); const x = it.transform[4]; const h = Math.abs(it.transform[3]) || it.height || 10;
        const font = (tc.styles[it.fontName] || {}).fontFamily || '';
        let row = rows.find(r => Math.abs(r.y - y) <= 2);
        if (!row) rows.push(row = { y, parts: [], h });
        row.parts.push({ x, s: it.str, bold: /bold|black|heavy/i.test(it.fontName + ' ' + font) });
      });
      rows.sort((a, b) => b.y - a.y).forEach(r => { r.parts.sort((a, b) => a.x - b.x); lines.push({ t: r.parts.map(x => x.s).join(' ').replace(/\s+/g, ' ').trim(), y: r.y, h: r.h, page: p, bold: r.parts.every(x => x.bold) }); });
    }
    // Unir líneas en párrafos por proximidad vertical y puntuación.
    const out = []; let cur = null;
    lines.forEach((ln, i) => {
      if (/^\d{1,3}$/.test(ln.t)) return; // números de página
      const prev = lines[i - 1];
      const gap = prev && prev.page === ln.page ? prev.y - ln.y : 999;
      const startsNew = !cur || gap > ln.h * 1.75 || /^([•·\-–▪]|\d+(\.\d+)*\.?\s|[a-zA-Z]\)\s)/.test(ln.t) || ln.bold !== cur.bold || /[.:;]$/.test(cur.t) && /^[A-ZÁÉÍÓÚÑ¿«"]/.test(ln.t) && gap > ln.h * 1.25;
      if (startsNew) { if (cur) out.push(cur); cur = { t: ln.t, bold: ln.bold, li: /^[•·\-–▪]/.test(ln.t) ? 0 : undefined }; }
      else cur.t = (cur.t.endsWith('-') ? cur.t.slice(0, -1) : cur.t + ' ') + ln.t;
    });
    if (cur) out.push(cur);
    return out.map(b => Object.assign(b, { t: b.t.replace(/^[•·▪]\s*/, '') }));
  },
  structure(blocks, file) {
    const isIndexLine = t => /(\.{4,}|…{2,})\s*\d*\s*$/.test(t) || /\t\s*\d+\s*$/.test(t) || /^\s*\S.{0,160}\s\d{1,3}\s*$/.test(t) && /^(\d+(\.\d+)*\.?\s|introducci|conclusi|bibliograf)/i.test(t);
    let num = null, title = '';
    const clean = [];
    let inIndex = false;
    blocks.forEach((b, i) => {
      const t = b.t.replace(/\s+/g, ' ').trim(); if (!t) return;
      const m = t.match(/^TEMA\s+(\d{1,2})\b\s*[.:\-–]?\s*(.*)$/i);
      if (m && num === null) { num = +m[1]; if (m[2] && m[2].length > 10) title = m[2]; return; }
      if (num !== null && !title && (b.bold || b.heading) && t.length > 15 && !/^índice$/i.test(t)) { title = t; return; }
      if (/^índice$/i.test(t)) { inIndex = true; return; }
      if (inIndex) { if (isIndexLine(t)) return; inIndex = false; }
      if (isIndexLine(t)) return;
      clean.push(Object.assign({}, b, { t }));
    });
    const secs = []; let cur = null, auto = 0;
    const kw = t => /^introducci[oó]n/i.test(t) ? 'intro' : /^conclusi[oó]n|^s[ií]ntesis/i.test(t) ? 'concl' : /^bibliograf|^referencias bibliogr/i.test(t) ? 'biblio' : null;
    clean.forEach(b => {
      const t = b.t, short = t.length < 190 && !/[.;]$/.test(t);
      const numm = t.match(/^(\d+(?:\.\d+){0,3})\.?\s+(\S.*)$/);
      const k = short && kw(t);
      const isSec = short && (k || (b.heading && b.heading <= 3) || (numm && (b.bold || b.heading)) || (b.bold && b.listed && t.length < 150));
      if (isSec) {
        const id = k || (numm ? numm[1] : `s${++auto}`);
        // Un apartado vacío con el mismo id suele ser una entrada del índice: se sustituye.
        const empty = secs.findIndex(s => s.id === id && !s.blocks.length);
        if (empty >= 0) secs.splice(empty, 1);
        let uidv = id, j = 2; while (secs.some(s => s.id === uidv)) uidv = `${id}-${j++}`;
        cur = { id: uidv, title: t, blocks: [] }; secs.push(cur); return;
      }
      if (!cur) { cur = { id: 'intro', title: 'Introducción', blocks: [] }; secs.push(cur); }
      if (short && (b.bold || b.heading) && t.length < 150) cur.blocks.push({ k: 'h', t });
      else if (b.li !== undefined && b.li !== null) cur.blocks.push(b.li > 0 ? { k: 'li', t, l: 1 } : { k: 'li', t });
      else cur.blocks.push({ k: 'p', t });
    });
    const sections = secs.filter(s => s.blocks.length);
    const words = sections.reduce((a, s) => a + s.blocks.reduce((x, b) => x + b.t.split(' ').length, 0), 0);
    return { n: num, title: title || '', short: '', file: file.name, fileType: file.name.split('.').pop().toUpperCase(), size: file.size, sections, words };
  }
};

          <div class="section-head"><div class="stack" style="gap:6px"><span class="eyebrow">Repaso inteligente</span><h2 class="h2">¿Qué debería repasar hoy?</h2></div></div>
          ${recs.length ? `<p class="muted small" style="margin-top:6px">Recomendamos un repaso breve basado en tu actividad:</p>
            <div class="reclist">${recs.map(g => `<div class="rec"><span class="hex solid" style="width:34px;height:39px"><span style="font-size:13px">T${g.t}</span></span><div><b>Tema ${g.t}</b><div class="why">${g.reasons.map(esc).join(' · ')}</div></div></div>`).join('')}</div>
            <div class="row"><button class="btn btn-accent" data-act="review-today" data-n="10">${ICON.repeat} Comenzar repaso</button><span class="small muted">10 preguntas · puedes ignorar la recomendación y configurar otro entrenamiento</span></div>`
        : `<div class="empty" style="margin-top:14px">${answered ? 'No hay nada urgente: tus errores están superados y ningún contenido está en riesgo de olvido.' : 'En cuanto completes tus primeros entrenamientos, aquí aparecerá qué conviene recuperar cada día.'}</div>
            <div class="row" style="margin-top:14px"><button class="btn btn-primary" data-act="nav" data-r="practicar">Empezar a entrenar</button></div>`}
        </div>
        <div class="stack" style="gap:16px">
          <div class="card">
            <div class="row" style="gap:10px"><span class="eyebrow plain" style="color:var(--orange-ink)">${ICON.bolt.replace('<svg', '<svg width="16" height="16"')} Entrenamiento breve</span></div>
            <h3 class="h2" style="margin-top:6px">Reto de 5</h3>
            <p class="muted small" style="margin:6px 0 14px">Cinco preguntas para aprovechar un hueco del día.</p>
            <div class="row"><select id="retoSrc" class="btn btn-ghost btn-sm" aria-label="Contenido del reto">
              <option value="varios">Varios temas</option><option value="recomendados">Contenidos recomendados</option><option value="errores">Mis errores</option>
              ${Catalog.activeList().map(n => `<option value="t${n}">Tema ${n}</option>`).join('')}</select>
              <button class="btn btn-primary btn-sm" data-act="reto">Empezar</button></div>
          </div>
          <div class="kpis two">
            <div class="kpi"><div class="v">${answered}</div><div class="l">preguntas respondidas</div></div>
            <div class="kpi"><div class="v">${answered ? pct(okAll, answered) + ' %' : '—'}</div><div class="l">aciertos globales</div></div>
            <div class="kpi"><div class="v">${c.p}</div><div class="l">errores pendientes</div></div>
            <div class="kpi"><div class="v">${c.s}</div><div class="l">errores superados</div></div>
          </div>
        </div>
      </section>
    </div>`;
  },

  /* ================= PRACTICAR (configurador) ================= */
  practice() {
    const cfg = this.cfg, act = Catalog.activeList();
    cfg.topics = cfg.topics.filter(n => act.includes(n));
    if (!cfg.topics.length && act.length) cfg.topics = act.slice(0, Math.min(3, act.length));
    const av = Engine.availability(cfg.topics);
    const wanted = cfg.count === 'custom' ? (parseInt(cfg.custom, 10) || 0) : cfg.count;
    const have = cfg.level === 'mix' ? av.total : av.byLevel[cfg.level];
    const near = cfg.level === 'mix' ? 0 : (av.byLevel[cfg.level - 1] || 0) + (av.byLevel[cfg.level + 1] || 0);
    const months = Catalog.config.months || [];
    const pending = TOTAL_TOPICS - act.length;
    const short = wanted > have;
    return `<div class="stack">
      <div class="section-head"><div class="stack" style="gap:6px"><span class="eyebrow">Practicar</span><h1 class="h2">Configura tu entrenamiento</h1></div></div>
      <div class="steps">
        <section class="step">
          <div class="step-h"><span class="step-n">1</span><h3>¿Qué quieres entrenar?</h3><span class="spacer"></span>
            <button class="btn btn-quiet btn-sm" data-act="sel-all">Seleccionar todos</button><button class="btn btn-quiet btn-sm" data-act="sel-none">Deseleccionar todos</button></div>
          ${months.length ? `<div class="row" style="margin-bottom:12px;gap:8px"><span class="small muted">Bloques:</span>${months.map(m => `<button class="fchip" data-act="sel-month" data-m="${esc(m.id)}">${esc(m.name)} · ${m.topics.map(n => 'T' + n).join(', ')}</button>`).join('')}</div>` : ''}
          <div class="topicgrid">${act.map(n => { const t = Catalog.topics[n]; const on = cfg.topics.includes(n); return `<button class="tcard" data-act="tog-topic" data-n="${n}" aria-pressed="${on}"><span class="hex"><span>${n}</span></span><span><span class="t1">Tema ${n}</span><span class="t2">${esc(t.short || t.title)}</span></span></button>`; }).join('') || '<div class="empty">Todavía no hay temas publicados.</div>'}</div>
          ${pending > 0 ? `<p class="small muted" style="margin-top:10px">${plural(pending, 'tema se incorporará', 'temas se irán incorporando')} a lo largo del curso.</p>` : ''}
        </section>
        <section class="step">
          <div class="step-h"><span class="step-n">2</span><h3>¿Cuántas preguntas?</h3></div>
          <div class="seg">${[10, 15, 20, 30, 40, 50].map(n => `<button data-act="set-count" data-v="${n}" aria-pressed="${cfg.count === n}">${n}</button>`).join('')}
            <button data-act="set-count" data-v="custom" aria-pressed="${cfg.count === 'custom'}">Otro</button>
            ${cfg.count === 'custom' ? `<input id="customCount" type="number" min="1" max="100" inputmode="numeric" value="${esc(cfg.custom)}" aria-label="Número personalizado">` : ''}</div>
        </section>
        <section class="step">
          <div class="step-h"><span class="step-n">3</span><h3>¿Qué dificultad?</h3></div>
          <div class="seg levels">${[1, 2, 3, 4, 'mix'].map(l => `<button data-act="set-level" data-v="${l}" aria-pressed="${cfg.level === l}">${l === 'mix' ? 'Mixto' : LEVELS[l]}<small>${LEVEL_HINT[l]}</small></button>`).join('')}</div>
          <p class="avail" style="margin-top:12px">En tu selección hay <b>${av.total}</b> preguntas: ${[1, 2, 3, 4].map(l => `${av.byLevel[l]} ${LEVELS[l].toLowerCase()}${av.byLevel[l] === 1 ? '' : 's'}`).join(' · ')}.</p>
        </section>
        <section class="step">
          <div class="step-h"><span class="step-n">4</span><h3>¿Cómo quieres entrenar?</h3></div>
          <div class="modes">
            <button class="mode" data-act="set-mode" data-v="learn" aria-pressed="${cfg.mode === 'learn'}"><b>Aprendizaje</b><span>Corrección, explicación y fuente después de cada respuesta.</span></button>
            <button class="mode" data-act="set-mode" data-v="exam" aria-pressed="${cfg.mode === 'exam'}"><b>Examen</b><span>Sin soluciones hasta terminar el cuestionario completo.</span></button>
          </div>
          <div class="row" style="margin-top:16px;gap:22px">
            <label class="toggle"><input type="checkbox" id="optConf" ${cfg.conf ? 'checked' : ''}> Indicar mi seguridad en cada respuesta</label>
            <label class="toggle"><input type="checkbox" id="optSmart" ${cfg.dist === 'smart' ? 'checked' : ''}> Distribución inteligente <span class="muted small">(más peso a lo que necesitas reforzar)</span></label>
          </div>
        </section>
        ${short && cfg.topics.length ? `<div class="notice">${ICON.alert}<div class="stack" style="gap:10px"><div>Con esta configuración hay <b>${have}</b> ${have === 1 ? 'pregunta disponible' : 'preguntas disponibles'} y has pedido ${wanted}. No repetimos preguntas para completar el número.</div>
          <div class="row">${have ? `<button class="btn btn-ghost btn-sm" data-act="use-avail">Hacer las ${have} disponibles</button>` : ''}${near && cfg.level !== 'mix' ? `<button class="btn btn-ghost btn-sm" data-act="fill-levels">Completar con niveles próximos (hasta ${Math.min(wanted, have + near)})</button>` : ''}<button class="btn btn-quiet btn-sm" data-act="set-level" data-v="mix">Pasar a nivel mixto</button></div></div></div>` : ''}
        <div class="startbar"><div class="sum"><b>${cfg.topics.length ? listTopics(cfg.topics.slice().sort((a, b) => a - b)) : 'Ningún tema'}</b> · ${Math.min(wanted, have) || 0} preguntas · ${cfg.level === 'mix' ? 'nivel mixto' : 'nivel ' + LEVELS[cfg.level].toLowerCase()} · modo ${cfg.mode === 'learn' ? 'aprendizaje' : 'examen'}</div>
          <button class="btn btn-accent btn-lg" data-act="start-practice" ${!cfg.topics.length || !have || !wanted ? 'disabled' : ''}>Comenzar ${ICON.arrow}</button></div>
      </div></div>`;
  },

  /* ================= CUESTIONARIO ================= */
  startSession(cfg) {
    const r = Engine.build(cfg);
    if (!r.items.length) { this.toast('No hay preguntas disponibles con esa configuración.'); return false; }
    this.session = { id: uid('s'), kind: cfg.kind, title: cfg.title, from: cfg.from || this.route, topics: uniq(r.items.map(i => Catalog.byId.get(i.id).t[0])).sort((a, b) => a - b), level: cfg.level, mode: cfg.mode, conf: cfg.conf, dist: cfg.dist, items: r.items, idx: 0, started: Date.now(), short: r.short };
    this.pendingSession = null; this.saveSession(); this._focusQ = true;
    if (r.short > 0 && cfg.count) this.toast(`Hay ${r.items.length} preguntas disponibles: no repetimos preguntas para completar ${cfg.count}.`);
    this.go('quiz');
    return true;
  },
  saveSession() { if (this.session) LS.set('session', this.session); },
  cur() { const s = this.session; const it = s.items[s.idx]; return { s, it, q: Catalog.byId.get(it.id) }; },

  quiz() {
    const s = this.session; if (!s) return this.home();
    const { it, q } = this.cur();
    if (!q) return `<div class="empty">Esta pregunta ya no está disponible.</div>`;
    const exam = s.mode === 'exam', n = s.items.length;
    const done = s.items.filter(i => exam ? Engine.answered(Catalog.byId.get(i.id) || {}, i) : i.checked).length;
    const locked = !exam && it.checked;
    const topic = Catalog.topics[q.t[0]];
    const stem = esc(q.q).replace('[NO]', '<span class="no">NO</span>').replace('____', '<span class="blank" aria-label="hueco"></span>');
    const instr = { m: 'Selecciona todas las respuestas correctas', r: 'Relaciona cada elemento con su pareja', n: 'Detecta la afirmación incorrecta', c: 'Elige el término que completa la afirmación', v: 'Indica si la afirmación es verdadera o falsa', u: 'Elige una respuesta' }[q.y];
    const answered = Engine.answered(q, it);
    return `<div class="quiz">
      <div class="qtop"><button class="btn btn-quiet btn-sm" data-act="quit">${ICON.x} Salir</button><div class="qprog" role="progressbar" aria-valuemin="0" aria-valuemax="${n}" aria-valuenow="${done}"><i style="width:${pct(done, n)}%"></i></div><span class="qcount">${s.idx + 1} / ${n}</span></div>
      ${this.confirmKey === 'quit' ? `<div class="confirm"><b>¿Salir del entrenamiento?</b><span class="spacer"></span><button class="btn btn-primary btn-sm" data-act="finish-now">Terminar y ver resultado</button><button class="btn btn-ghost btn-sm" data-act="abandon">Salir sin guardar</button><button class="btn btn-quiet btn-sm" data-act="cancel-confirm">Seguir</button></div>` : ''}
      <article class="qcard" tabindex="-1" aria-live="polite">
        <div class="qmeta"><span class="chip amber">Tema ${q.t.join(' + ')}</span><span class="chip">${LEVELS[q.l]}</span><span class="chip">${TYPES[q.y]}</span>${q.id.startsWith('g-') ? `<span class="chip sky">${ICON.spark.replace('<svg', '<svg width="14" height="14"')} Nueva pregunta</span>` : ''}</div>
        <p class="qinstr">${instr}</p>
        <h2 class="qstem">${stem}</h2>
        ${this.renderAnswer(q, it, locked)}
        ${s.conf && !locked ? `<div class="conf" ${answered ? '' : 'hidden'}><h4>¿Qué seguridad tienes en tu respuesta?</h4><div class="seg">${['L', 'M', 'H'].map(c => `<button data-act="conf" data-c="${c}" aria-pressed="${it.conf === c}">${{ L: 'Baja', M: 'Media', H: 'Alta' }[c]}</button>`).join('')}</div>${exam ? '' : '<p class="small muted">Al elegir tu seguridad se comprueba la respuesta.</p>'}</div>` : ''}
        ${locked ? this.feedback(q, it) : ''}
        <div class="qactions">${this.quizActions(q, it, locked, answered)}</div>
      </article>
      ${exam ? `<div class="card tight"><div class="row" style="margin-bottom:10px"><span class="eyebrow plain">Navegación del examen</span><span class="spacer"></span><span class="small muted">${done} de ${n} respondidas</span></div><div class="navgrid">${s.items.map((x, i) => `<button data-act="goto" data-i="${i}" class="${Engine.answered(Catalog.byId.get(x.id) || {}, x) ? 'done' : ''} ${i === s.idx ? 'cur' : ''}" aria-label="Pregunta ${i + 1}">${i + 1}</button>`).join('')}</div>
        ${this.confirmKey === 'finish' ? `<div class="confirm" style="margin-top:12px"><span>Te quedan <b>${n - done}</b> sin responder. ¿Quieres terminar el examen?</span><span class="spacer"></span><button class="btn btn-primary btn-sm" data-act="finish-now">Terminar y corregir</button><button class="btn btn-quiet btn-sm" data-act="cancel-confirm">Seguir respondiendo</button></div>` : ''}</div>` : ''}
    </div>`;
  },

  renderAnswer(q, it, locked) {
    const letter = i => String.fromCharCode(65 + i);
    const cls = (orig, sel) => {
      if (!locked) return '';
      const correct = q.y === 'm' ? q.a.includes(orig) : orig === q.a;
      if (correct) return 'is-ok';
      return sel ? 'is-bad' : '';
    };
    if (q.y === 'v') {
      return `<div class="vf">${[true, false].map((v, i) => { const sel = it.ans === v; const c = locked ? (v === q.a ? 'is-ok' : sel ? 'is-bad' : '') : ''; return `<button class="opt ${c}" data-act="opt" data-v="${v}" aria-pressed="${sel}" ${locked ? 'disabled' : ''}><span class="k">${v ? 'V' : 'F'}</span><span>${v ? 'Verdadero' : 'Falso'}</span></button>`; }).join('')}</div>`;
    }
    if (q.y === 'r') {
      const rights = it.rperm;
      return `<div class="match">${q.p.map((p, i) => {
        const v = it.ans[i]; const c = locked ? (v === i ? 'is-ok' : 'is-bad') : '';
        return `<div class="mrow ${c}"><span class="ml">${esc(p[0])}</span><select data-act="match" data-i="${i}" ${locked ? 'disabled' : ''} aria-label="Pareja de ${esc(p[0])}"><option value="">Elige…</option>${rights.map(j => `<option value="${j}" ${v === j ? 'selected' : ''}>${esc(q.p[j][1])}</option>`).join('')}</select>${locked && v !== i ? `<span class="fix">Correcta: <b>${esc(p[1])}</b></span>` : ''}</div>`;
      }).join('')}</div>`;
    }
    const multi = q.y === 'm';
    return `<div class="opts">${it.perm.map((orig, pos) => {
      const sel = multi ? it.ans.includes(orig) : it.ans === orig;
      const c = cls(orig, sel);
      const mark = locked && c === 'is-ok' ? '<span class="mark" style="color:var(--ok)">Correcta</span>' : locked && c === 'is-bad' ? '<span class="mark" style="color:var(--bad)">Tu respuesta</span>' : '';
      return `<button class="opt ${multi ? 'multi' : ''} ${c}" data-act="opt" data-o="${orig}" aria-pressed="${sel}" ${locked ? 'disabled' : ''}><span class="k">${letter(pos)}</span><span>${esc(q.o[orig])}</span>${mark}</button>`;
    }).join('')}</div>`;
  },

  quizActions(q, it, locked, answered) {
    const s = this.session, exam = s.mode === 'exam', last = s.idx === s.items.length - 1;
    if (exam) {
      return `<button class="btn btn-ghost" data-act="prev" ${s.idx === 0 ? 'disabled' : ''}>${ICON.back} Anterior</button>
        ${answered ? `<button class="btn btn-quiet" data-act="clear">Dejar en blanco</button>` : ''}
        <span class="spacer"></span>
        ${last ? `<button class="btn btn-accent" data-act="finish">Terminar examen</button>` : `<button class="btn btn-primary" data-act="next">Siguiente ${ICON.arrow}</button>`}`;
    }
    if (locked) return `<span class="spacer"></span><button class="btn btn-primary btn-lg" data-act="${last ? 'finish-now' : 'next'}">${last ? 'Ver resultado' : 'Siguiente'} ${ICON.arrow}</button>`;
    return `<button class="btn btn-quiet" data-act="skip">No lo sé</button><span class="spacer"></span>
      ${s.conf ? '' : `<button class="btn btn-primary btn-lg" data-act="check" ${answered ? '' : 'disabled'}>Comprobar</button>`}`;
  },

  feedback(q, it) {
    const ok = Engine.grade(q, it);
    const cls = ok === true ? 'ok' : ok === false ? 'bad' : 'skip';
    const verdict = ok === true ? `${ICON.check.replace('<svg', '<svg width="24" height="24"')} CORRECTO` : ok === false ? `${ICON.x.replace('<svg', '<svg width="24" height="24"')} INCORRECTO` : 'SIN RESPONDER';
    const f = q.f[0];
    const letterOf = orig => it.perm ? String.fromCharCode(65 + it.perm.indexOf(orig)) + ') ' : '';
    const corr = q.y === 'm' ? q.a.map(i => letterOf(i) + esc(q.o[i])).join('<br>') : q.y === 'r' ? q.p.map(p => `${esc(p[0])} → ${esc(p[1])}`).join('<br>') : q.y === 'v' ? (q.a ? 'Verdadero' : 'Falso') : letterOf(q.a) + esc(q.o[q.a]);
    return `<div class="feedback ${cls}">
      <div class="verdict">${verdict}</div>
      ${ok !== true ? `<div class="fb-row"><span class="lbl">Respuesta correcta</span><div>${corr}</div></div>` : ''}
      <div class="explain">${ICON.bulb}<div class="fb-row"><span class="lbl">Explicación</span><div>${esc(q.e)}</div></div></div>
      <div class="source"><span>Fuente: <b>Tema ${f.t}</b></span><span>Apartado: <b>${esc(Catalog.sectionTitle(f.t, f.s))}</b></span><button class="linkbtn" data-act="source" data-q="${q.id}">${ICON.book.replace('<svg', '<svg width="16" height="16" style="vertical-align:-3px"')} Ver en el tema</button></div>
    </div>`;
  },

  check() {
    const { s, it, q } = this.cur();
    if (s.mode === 'exam') return this.move(1);
    if (!Engine.answered(q, it)) return;
    it.checked = true; it.ok = Engine.grade(q, it); this.saveSession(); this.render();
  },
  move(d) {
    const s = this.session; const ni = s.idx + d;
    if (ni < 0 || ni >= s.items.length) return;
    s.idx = ni; this.confirmKey = null; this._focusQ = true; this.saveSession(); this.render();
    const top = document.querySelector('.quiz'); if (top) top.scrollIntoView({ block: 'start' });
  },

  async finish() {
    const s = this.session; if (!s) return;
    s.items.forEach(it => { if (s.mode === 'learn' && !it.checked) { it.ans = Array.isArray(it.ans) ? (Catalog.byId.get(it.id).y === 'r' ? it.ans.map(() => null) : []) : null; } });
    const summary = Progress.apply(s);
    s.done = true; LS.del('session');
    this.result = { session: s, summary };
    this.route = 'resultado'; this.confirmKey = null; this.render(); window.scrollTo(0, 0);
    const ok = await Store.save();
    if (!ok && Store.mode === 'local') this.renderChrome();
  },

  /* ================= RESULTADOS ================= */
  results() {
    const r = this.result; if (!r) return this.home();
    const { session: s, summary: m } = r;
    const graded = s.items.map(it => { const q = Catalog.byId.get(it.id); return { it, q, ok: q ? Engine.grade(q, it) : null }; }).filter(x => x.q);
    const cf = { okH: 0, okM: 0, okL: 0, koH: 0, koM: 0, koL: 0 };
    graded.forEach(x => { if (x.it.conf && x.ok !== null) cf[(x.ok ? 'ok' : 'ko') + x.it.conf]++; });
    const usedConf = s.conf && Object.values(cf).some(Boolean);
    const topics = Object.entries(m.pt);
    const wrongIds = graded.filter(x => x.ok === false).map(x => x.q.id);
    return `<div class="stack">
      <div class="card lift"><div class="result-hero">
        <div><span class="eyebrow">Resultado</span><div class="score">${m.ok}<small> / ${m.n}</small></div><div class="pct">${pct(m.ok, m.n)} % de aciertos</div></div>
        <div class="stack" style="gap:12px">
          <div class="meter" aria-hidden="true">${m.ok ? `<i class="m-ok" style="width:${pct(m.ok, m.n)}%"></i>` : ''}${m.ko ? `<i class="m-bad" style="width:${pct(m.ko, m.n)}%"></i>` : ''}${m.un ? `<i class="m-un" style="width:${pct(m.un, m.n)}%"></i>` : ''}</div>
          <div class="legend"><span><i style="background:var(--ok)"></i>${m.ok} correctas</span><span><i style="background:var(--bad)"></i>${m.ko} incorrectas</span><span><i style="background:var(--none)"></i>${m.un} sin responder</span></div>
          <div class="row small muted" style="gap:6px 16px"><span>${esc(s.title || KINDS[s.kind] || 'Entrenamiento')}</span><span>Temas: ${s.topics.join(', ')}</span><span>Dificultad: ${s.level === 'mix' || !s.level ? 'mixta' : LEVELS[s.level].toLowerCase()}</span><span>Modalidad: ${s.mode === 'exam' ? 'examen' : 'aprendizaje'}</span></div>
          <div class="row">
            ${wrongIds.length ? `<button class="btn btn-accent" data-act="retry-these">${ICON.repeat} Repetir los ${wrongIds.length} errores</button><button class="btn btn-ghost" data-act="new-these">Nuevas preguntas sobre estos errores</button>` : ''}
            <button class="btn btn-primary" data-act="nav" data-r="practicar">Nuevo entrenamiento</button>
            <button class="btn btn-quiet" data-act="nav" data-r="inicio">Inicio</button>
          </div>
          ${Store.mode === 'local' ? `<p class="small muted">Resultado guardado en este navegador.</p>` : ''}
        </div></div></div>
      <div class="grid2">
        ${topics.length > 1 ? `<div class="card"><span class="eyebrow">Por tema</span><h3 class="h3" style="margin:6px 0 16px">Aciertos en cada tema</h3><div class="bars">${topics.map(([t, v]) => `<div class="bar"><span class="lab">Tema ${t}</span><div class="track" title="${v[1]} de ${v[0]}"><div class="fill" style="width:${pct(v[1], v[0])}%"></div></div><span class="val">${pct(v[1], v[0])} %</span></div>`).join('')}</div></div>` : ''}
        ${usedConf ? `<div class="card"><span class="eyebrow">Seguridad en tus respuestas</span><h3 class="h3" style="margin:6px 0 16px">Qué dice tu seguridad de tu aprendizaje</h3>
          <div class="matrix">
            <div class="mcell"><div class="n">${cf.okH}</div><div class="t">Correcta + seguridad alta</div><div class="d">Conocimiento probablemente consolidado.</div></div>
            <div class="mcell"><div class="n">${cf.okL}</div><div class="t">Correcta + seguridad baja</div><div class="d">Aciertas, pero todavía con inseguridad.</div></div>
            <div class="mcell"><div class="n">${cf.koL}</div><div class="t">Incorrecta + seguridad baja</div><div class="d">Contenido todavía no consolidado.</div></div>
            <div class="mcell ${cf.koH ? 'alert' : ''}"><div class="n">${cf.koH}</div><div class="t">Incorrecta + seguridad alta</div><div class="d">Posible error conceptual: creías correcta una respuesta equivocada. Tendrá prioridad en tus repasos.</div></div>
          </div>${cf.okM + cf.koM ? `<p class="small muted" style="margin-top:10px">Con seguridad media: ${cf.okM} correctas y ${cf.koM} incorrectas.</p>` : ''}</div>` : ''}
      </div>
      <div class="card"><div class="section-head"><div><span class="eyebrow">Revisión</span><h3 class="h3" style="margin-top:6px">Todas las preguntas, con su explicación y su fuente</h3></div></div>
        <div class="review" style="margin-top:14px">${graded.map((x, i) => this.reviewItem(x, i)).join('')}</div></div>
    </div>`;
  },
  reviewItem({ it, q, ok }, i) {
    const f = q.f[0];
    return `<details class="ritem" ${ok === false && i < 60 ? '' : ''}><summary><span class="ic ${ok === true ? 'ok' : ok === false ? 'bad' : 'un'}">${ok === true ? '✓' : ok === false ? '✗' : '–'}</span><span class="rq">${i + 1}. ${esc(q.q).replace('[NO]', '<b style="color:var(--bad)">NO</b>')}</span><span class="small muted">T${q.t.join('+')} · ${LEVELS[q.l]}</span></summary>
      <div class="rb"><div class="fb-row"><span class="lbl">Tu respuesta${it.conf ? ` · seguridad ${{ L: 'baja', M: 'media', H: 'alta' }[it.conf]}` : ''}</span><div>${esc(Engine.answerText(q, it.ans))}</div></div>
      ${ok !== true ? `<div class="fb-row"><span class="lbl">Respuesta correcta</span><div>${esc(Engine.answerText(q, 'correct'))}</div></div>` : ''}
      <div class="explain">${ICON.bulb}<div>${esc(q.e)}</div></div>
      <div class="source"><span>Tema ${f.t} · ${esc(Catalog.sectionTitle(f.t, f.s))}</span><button class="linkbtn" data-act="source" data-q="${q.id}">Ver en el tema</button></div></div></details>`;
  },

  /* ================= REPASAR ================= */
  review() {
    const recs = Recommend.today(), c = Errors.counts();
    const memo = Catalog.activeList().map(n => Object.assign({ n }, Mastery.topic(n))).filter(m => m.reviewRecommended);
    return `<div class="stack">
      <div class="section-head"><div class="stack" style="gap:6px"><span class="eyebrow">Repasar</span><h1 class="h2">Recupera lo que conviene recuperar</h1></div></div>
      <div class="grid2">
        <div class="card lift"><span class="eyebrow">Repaso inteligente</span><h2 class="h2" style="margin:6px 0 4px">¿Qué debería repasar hoy?</h2>
          ${recs.length ? `<div class="reclist">${recs.map(g => `<div class="rec"><span class="hex solid" style="width:34px;height:39px"><span style="font-size:13px">T${g.t}</span></span><div><b>Tema ${g.t}</b><div class="why">${g.reasons.map(esc).join(' · ')}</div></div></div>`).join('')}</div>
            <div class="row"><div class="seg" role="group" aria-label="Número de preguntas">${[10, 15, 20].map(n => `<button data-act="review-today" data-n="${n}">${n} preguntas</button>`).join('')}</div></div>`
        : `<div class="empty" style="margin-top:12px">Sin recomendaciones por ahora. Se generan a partir de tus errores, de los contenidos poco practicados y del tiempo que pasa sin revisar cada contenido.</div>`}
        </div>
        <div class="card"><span class="eyebrow">Cuaderno de errores</span><h2 class="h2" style="margin:6px 0 4px">Repasar mis errores</h2>
          <p class="small muted" style="margin-bottom:14px">${c.all ? `${c.p} pendientes · ${c.c} en consolidación · ${c.r} reincidentes · ${c.hc} con seguridad alta` : 'Aún no has cometido errores registrados.'}</p>
          ${this.errorScopeControls()}
        </div>
        <div class="card"><span class="eyebrow">Personalizado</span><h2 class="h2" style="margin:6px 0 4px">Entrenar mis puntos débiles</h2>
          <p class="small muted" style="margin-bottom:14px">Cuestionario construido con tus temas de menor dominio, los conceptos fallados, los errores reincidentes o con seguridad alta y los contenidos inseguros. Prioriza preguntas nuevas sobre esos contenidos.</p>
          <div class="row"><select id="weakTopic" class="btn btn-ghost btn-sm" aria-label="Temas"><option value="0">Todos los temas</option>${Catalog.activeList().map(n => `<option value="${n}">Tema ${n}</option>`).join('')}</select>
          <div class="seg">${[10, 20].map(n => `<button data-act="weak" data-n="${n}">${n} preguntas</button>`).join('')}</div></div>
        </div>
        <div class="card"><span class="eyebrow">Memoria a largo plazo</span><h2 class="h2" style="margin:6px 0 4px">Comprobaciones pendientes</h2>
          ${memo.length ? `<p class="small muted">Temas con dominio registrado que hace tiempo que no entrenas. No significa que los hayas olvidado: conviene comprobarlo con preguntas nuevas.</p><div class="stack" style="gap:8px;margin-top:12px">${memo.map(m => `<div class="rec"><span class="hex solid" style="width:34px;height:39px"><span style="font-size:13px">T${m.n}</span></span><div class="row" style="justify-content:space-between"><div><b>Tema ${m.n}</b><div class="why">Dominio ${m.idx} % · último entrenamiento ${daysAgoText(m.days)} · <b>repaso recomendado</b></div></div><button class="btn btn-ghost btn-sm" data-act="train-topic" data-n="${m.n}">Comprobar</button></div></div>`).join('')}</div>`
        : `<p class="small muted">Cuando un tema dominado lleve semanas sin aparecer, lo verás aquí con la recomendación de comprobarlo.</p>`}
          <hr class="divider" style="margin:16px 0">
          <span class="eyebrow plain" style="color:var(--orange-ink)">Reto de 5</span>
          <div class="row" style="margin-top:8px"><select id="retoSrc" class="btn btn-ghost btn-sm" aria-label="Contenido del reto"><option value="recomendados">Contenidos recomendados</option><option value="errores">Mis errores</option><option value="varios">Varios temas</option>${Catalog.activeList().map(n => `<option value="t${n}">Tema ${n}</option>`).join('')}</select><button class="btn btn-primary btn-sm" data-act="reto">Empezar</button></div>
        </div>
      </div></div>`;
  },
  errorScopeControls(compact) {
    const c = Errors.counts();
    if (!c.all) return `<div class="empty">Cuando falles una pregunta se guardará aquí automáticamente.</div>`;
    return `<div class="stack" style="gap:12px">
      <div class="row"><select id="errScope" class="btn btn-ghost btn-sm" aria-label="Qué errores">
        ${[['todos', 'Todos mis errores'], ['pendientes', 'Errores todavía no superados'], ['recientes', 'Errores recientes (7 días)'], ['reincidentes', 'Errores reincidentes'], ['confianza', 'Errores con seguridad alta'], ['tema', 'Errores de un tema']].map(([v, l]) => `<option value="${v}" ${this.escope === v ? 'selected' : ''}>${l}</option>`).join('')}</select>
        ${this.escope === 'tema' ? `<select id="errTopicSel" class="btn btn-ghost btn-sm" aria-label="Tema">${uniq(Errors.list().map(e => e.t)).sort((a, b) => a - b).map(n => `<option value="${n}" ${this.etopic === n ? 'selected' : ''}>Tema ${n}</option>`).join('')}</select>` : ''}</div>
      <div class="row"><button class="btn btn-primary" data-act="err-retry">${ICON.repeat} Volver a intentar mis errores</button><button class="btn btn-ghost" data-act="err-new">Generar nuevas preguntas sobre mis errores</button></div>
      ${AI.available() ? `<button class="linkbtn small" data-act="err-ai" style="align-self:flex-start">${ICON.spark.replace('<svg', '<svg width="15" height="15" style="vertical-align:-2px"')} Crear preguntas inéditas con IA a partir de la fuente de mis errores</button>` : ''}
    </div>`;
  },

  /* ================= SIMULAR ================= */
  simulate() {
    const months = Catalog.config.months || [], act = Catalog.activeList();
    const sim = this.sim || (this.sim = { month: months.length ? months[months.length - 1].id : '', n: 30, level: 'mix', conf: true });
    const m = months.find(x => x.id === sim.month);
    const mTopics = m ? m.topics.filter(n => Catalog.active(n)) : [];
    return `<div class="stack">
      <div class="section-head"><div class="stack" style="gap:6px"><span class="eyebrow">Simular</span><h1 class="h2">Simulacros en modalidad examen</h1><p class="muted">Sin soluciones hasta el final. Al terminar verás la corrección completa, con explicación y fuente de cada pregunta.</p></div></div>
      <div class="card"><div class="row" style="gap:18px">
        <div class="field">Número de preguntas<div class="seg">${[20, 30, 40, 50].map(n => `<button data-act="sim-n" data-v="${n}" aria-pressed="${sim.n === n}">${n}</button>`).join('')}</div></div>
        <div class="field">Dificultad<div class="seg">${['mix', 2, 3, 4].map(l => `<button data-act="sim-l" data-v="${l}" aria-pressed="${sim.level === l}">${l === 'mix' ? 'Mixta' : LEVELS[l]}</button>`).join('')}</div></div>
        <label class="toggle" style="align-self:flex-end;margin-bottom:10px"><input type="checkbox" id="simConf" ${sim.conf ? 'checked' : ''}> Indicar mi seguridad</label>
      </div></div>
      <div class="grid2">
        <div class="card lift"><span class="eyebrow">Bloque mensual</span><h2 class="h2" style="margin:6px 0 8px">Simulacro del mes</h2>
          ${months.length ? `<div class="row" style="margin-bottom:14px"><select id="simMonth" class="btn btn-ghost btn-sm" aria-label="Bloque">${months.map(x => `<option value="${esc(x.id)}" ${x.id === sim.month ? 'selected' : ''}>${esc(x.name)} · Temas ${x.topics.join(', ')}</option>`).join('')}</select></div>
            <p class="small muted" style="margin-bottom:14px">${mTopics.length ? `${Engine.countFor(mTopics, sim.level)} preguntas disponibles en ${listTopics(mTopics)}.` : 'Los temas de este bloque todavía no están publicados.'}</p>
            <button class="btn btn-accent" data-act="sim-month" ${mTopics.length ? '' : 'disabled'}>Empezar simulacro del mes ${ICON.arrow}</button>`
        : `<div class="empty">El preparador todavía no ha definido bloques mensuales.</div>`}</div>
        <div class="card lift"><span class="eyebrow">Temario acumulado</span><h2 class="h2" style="margin:6px 0 8px">Simulacro acumulativo</h2>
          <p class="small muted" style="margin-bottom:14px">Todos los temas publicados hasta hoy (${act.length ? listTopics(act) : 'ninguno'}), con un reparto equilibrado para que ningún tema acapare el examen. ${Engine.countFor(act, sim.level)} preguntas disponibles.</p>
          <button class="btn btn-primary" data-act="sim-all" ${act.length ? '' : 'disabled'}>Empezar simulacro acumulativo ${ICON.arrow}</button></div>
      </div></div>`;
  },

  /* ================= CUADERNO DE ERRORES ================= */
  errors() {
    const c = Errors.counts();
    let list = Errors.list();
    const f = this.efilter;
    if (f === 'p') list = list.filter(e => e.st === 'p'); else if (f === 'c') list = list.filter(e => e.st === 'c'); else if (f === 's') list = list.filter(e => e.st === 's'); else if (f === 'r') list = list.filter(e => Errors.isReinc(e));
    if (this.etopic) list = list.filter(e => e.t === this.etopic);
    const topics = uniq(Errors.list().map(e => e.t)).sort((a, b) => a - b);
    const chips = [['all', 'Todos', c.all], ['p', 'Pendientes', c.p], ['c', 'En consolidación', c.c], ['s', 'Superados', c.s], ['r', 'Reincidentes', c.r]];
    return `<div class="stack">
      <div class="section-head"><div class="stack" style="gap:6px"><span class="eyebrow">Mi cuaderno de errores</span><h1 class="h2">Cada error, guardado para convertirlo en aprendizaje</h1></div></div>
      <div class="card">${this.errorScopeControls()}</div>
      ${c.all ? `<div class="row"><div class="filterbar">${chips.map(([k, l, n]) => `<button class="fchip" data-act="efilter" data-v="${k}" aria-pressed="${f === k}">${l}<span class="n">${n}</span></button>`).join('')}</div><span class="spacer"></span>
        <select id="errTopic" class="btn btn-ghost btn-sm" aria-label="Filtrar por tema"><option value="0">Todos los temas</option>${topics.map(n => `<option value="${n}" ${this.etopic === n ? 'selected' : ''}>Tema ${n}</option>`).join('')}</select></div>
        <p class="small muted">Un error no se da por superado por acertar una sola vez la misma pregunta: hace falta acertar preguntas diferentes sobre el mismo contenido.</p>
        <div class="stack" style="gap:10px">${list.map(e => this.errorCard(e)).join('') || '<div class="empty">No hay errores con este filtro.</div>'}</div>` : ''}
    </div>`;
  },
  errorCard(e) {
    const items = Object.entries(e.items).sort((a, b) => b[1].t - a[1].t);
    const st = { p: 'Error pendiente', c: 'En consolidación', s: 'Superado' }[e.st];
    const firstItem = items[0] && items[0][1];
    return `<details class="ecard"><summary>
      <div class="etitle"><b>${esc(Catalog.conceptLabel(e.c))}</b><span class="stepper ${e.st}"><i></i><i></i><i></i>&nbsp;${st}</span></div>
      <div class="emeta"><span>Tema ${e.t}</span>${firstItem ? `<span>${esc(Catalog.sectionTitle(e.t, firstItem.s) || '')}</span><span>${esc(CATS[firstItem.k] || '')}</span>` : ''}<span>${plural(e.cnt, 'fallo', 'fallos')}</span><span>Último: ${fmtDate(e.last)}</span>${e.hc ? `<span class="chip bad">${e.hc} con seguridad alta</span>` : ''}</div>
      ${Errors.isReinc(e) ? `<div class="reinc">${ICON.alert.replace('<svg', '<svg width="18" height="18"')} Error reincidente: has fallado preguntas relacionadas con este concepto en ${e.cnt} ocasiones.</div>` : ''}
    </summary><div class="ebody">
      ${items.map(([id, x]) => { const q = Catalog.byId.get(id); return `<div class="eitem"><div><b>${esc((q ? q.q : x.q || '').replace('[NO]', 'NO'))}</b></div>
        <div class="small"><span class="muted">Tu respuesta:</span> ${esc(x.sel)}</div>
        <div class="small"><span class="muted">Correcta:</span> <b>${esc(q ? Engine.answerText(q, 'correct') : x.cor || '')}</b></div>
        ${q ? `<div class="explain small">${ICON.bulb}<div>${esc(q.e)}</div></div>` : ''}
        <div class="emeta"><span>${LEVELS[x.l] || ''}</span><span>Seguridad: ${{ L: 'baja', M: 'media', H: 'alta', N: 'no indicada' }[x.conf] || 'no indicada'}</span><span>Fallada ${plural(x.cnt, 'vez', 'veces')}</span><span>${fmtDate(x.t)}</span>${q ? `<button class="linkbtn" data-act="source" data-q="${q.id}">Ver en el tema</button>` : ''}</div></div>`; }).join('')}
      <div class="row"><button class="btn btn-primary btn-sm" data-act="concept-new" data-c="${esc(e.c)}">Nuevas preguntas sobre este contenido</button><button class="btn btn-ghost btn-sm" data-act="concept-retry" data-c="${esc(e.c)}">Volver a intentar</button></div>
    </div></details>`;
  },

  /* ================= RADIOGRAFÍA ================= */
  xray() {
    const cells = [];
    for (let n = 1; n <= TOTAL_TOPICS; n++) {
      const pub = Catalog.active(n);
      const m = pub ? Mastery.topic(n) : null;
      const cls = !pub ? 'hc-off' : 'hc-' + m.status;
      cells.push(`<button class="xcell" data-act="xsel" data-n="${n}" ${pub ? '' : 'disabled'} aria-pressed="${this.xsel === n}" aria-label="Tema ${n}${pub ? ', ' + Mastery.statusLabel(m.status) : ', no publicado'}"><span class="hex ${cls}"><span class="in"><span>${n}</span>${pub && m.status !== 'nd' ? `<small>${m.idx}%</small>` : ''}</span></span><span class="lb">${!pub ? 'Próximamente' : { dom: 'Dominado', con: 'Consolidando', ref: 'Refuerzo', nd: 'Sin datos' }[m.status]}</span></button>`);
    }
    const act = Catalog.activeList();
    if (!this.xsel || !Catalog.active(this.xsel)) this.xsel = act.find(n => Store.state.tp[n]) || act[0] || null;
    return `<div class="stack">
      <div class="section-head"><div class="stack" style="gap:6px"><span class="eyebrow">Mi radiografía del temario</span><h1 class="h2">Los 25 temas, de un vistazo</h1></div>
        <div class="legend"><span class="status s-dom"><i></i>Dominado</span><span class="status s-con"><i></i>En consolidación</span><span class="status s-ref"><i></i>Necesita refuerzo</span><span class="status s-nd"><i></i>Sin datos suficientes</span></div></div>
      <div class="card"><div class="xgrid">${cells.join('')}</div></div>
      ${this.xsel ? this.topicDetail(this.xsel) : ''}
    </div>`;
  },
  topicDetail(n) {
    const t = Catalog.topics[n], m = Mastery.topic(n);
    const strong = m.cats.filter(c => c.enough && c.idx >= 70), weak = m.cats.filter(c => c.enough && c.idx < 70).sort((a, b) => a.idx - b.idx);
    const catBar = c => `<div class="bar"><span class="lab">${esc(CATS[c.k] || c.k)}</span><div class="track"><div class="fill" style="width:${c.idx}%;background:${c.idx >= 75 ? 'var(--ok)' : c.idx >= 50 ? 'var(--warn)' : 'var(--bad)'}"></div></div><span class="val">${c.idx} %</span></div>`;
    return `<div class="card lift" id="tdetail"><div class="tdetail">
      <div class="stack" style="gap:14px">
        <div><span class="eyebrow">Tema ${n}</span><h2 class="h3" style="margin-top:6px">${esc(t.short || t.title)}</h2></div>
        <div><div class="small muted">Índice de dominio</div><div class="bignum">${m.status === 'nd' && !m.n ? '—' : m.idx}<small>${m.status === 'nd' && !m.n ? '' : ' %'}</small></div><span class="status ${Mastery.statusClass(m.status)}"><i></i>${Mastery.statusLabel(m.status)}</span>
          ${m.reviewRecommended ? `<div class="chip amber" style="margin-top:8px">Repaso recomendado</div>` : ''}</div>
        <dl class="facts"><dt>Preguntas realizadas</dt><dd>${m.n}</dd><dt>Errores pendientes</dt><dd>${m.pending}</dd><dt>Errores superados</dt><dd>${m.overcome}</dd><dt>Contenidos en riesgo de olvido</dt><dd>${m.due}</dd><dt>Último entrenamiento</dt><dd>${daysAgoText(m.days)}</dd></dl>
        <div class="stack" style="gap:8px"><button class="btn btn-accent" data-act="train-topic" data-n="${n}">Entrenar este tema</button><button class="btn btn-ghost" data-act="weak-topic" data-n="${n}">Entrenar mis puntos débiles</button><button class="btn btn-quiet btn-sm" data-act="read-topic" data-n="${n}">${ICON.book.replace('<svg', '<svg width="16" height="16"')} Leer el tema procesado</button></div>
      </div>
      <div class="stack" style="gap:18px">
        ${m.n ? `<div><h3 class="h3" style="margin-bottom:10px">Fortalezas</h3>${strong.length ? `<div class="bars">${strong.map(catBar).join('')}</div>` : '<p class="small muted">Todavía no hay categorías con datos suficientes por encima del 70 %.</p>'}</div>
        <div><h3 class="h3" style="margin-bottom:10px">Aspectos a reforzar</h3>${weak.length ? `<div class="bars">${weak.map(catBar).join('')}</div>` : '<p class="small muted">Ninguna categoría con datos suficientes está por debajo del 70 %.</p>'}</div>
        ${m.cats.some(c => !c.enough) ? `<p class="small muted">Sin datos suficientes todavía: ${m.cats.filter(c => !c.enough).map(c => (CATS[c.k] || c.k).toLowerCase()).join(', ')}.</p>` : ''}
        ${m.comp ? `<details class="explainer"><summary>¿Cómo se calcula el índice de dominio?</summary>
          <p style="margin-top:8px">No es el porcentaje bruto de aciertos (${m.comp.raw} %). Pondera la dificultad de cada pregunta y tu seguridad, da más peso a lo reciente, exige una muestra suficiente y tiene en cuenta el tiempo sin entrenar. El tiempo que tardas en responder no se usa.</p>
          <div class="comp"><span>Aciertos ponderados por dificultad y seguridad</span><span>${m.comp.life} %</span><span>Rendimiento en tus últimas 30 respuestas</span><span>${m.comp.recent} %</span><span>Muestra (peso acumulado de las respuestas)</span><span>${m.comp.weight}</span><span>Contenidos del tema que ya has practicado</span><span>${m.comp.cov} %</span><span>Descuento por tiempo sin entrenar</span><span>−${m.comp.forget} %</span><span>Errores reincidentes pendientes</span><span>−${m.comp.adjNeg} pts</span><span>Errores superados</span><span>+${m.comp.adjPos} pts</span></div></details>` : ''}`
        : `<div class="empty">Aún no has entrenado este tema. Tras las primeras preguntas verás aquí tus fortalezas y lo que conviene reforzar.</div>`}
      </div></div></div>`;
  },

  /* ================= PROGRESO ================= */
  progress() {
    const H = Store.hist.quizzes, answered = H.reduce((a, q) => a + q.n, 0), ok = H.reduce((a, q) => a + q.ok, 0), c = Errors.counts();
    const an = Analysis.build();
    const act = Catalog.activeList();
    const rec = Recommend.concepts().slice(0, 8);
    return `<div class="stack">
      <div class="section-head"><div class="stack" style="gap:6px"><span class="eyebrow">Mi progreso</span><h1 class="h2">Tu evolución, entrenamiento a entrenamiento</h1></div></div>
      <div class="kpis">
        <div class="kpi"><div class="v">${H.length}</div><div class="l">cuestionarios realizados</div></div>
        <div class="kpi"><div class="v">${answered}</div><div class="l">preguntas contestadas</div></div>
        <div class="kpi"><div class="v">${answered ? pct(ok, answered) + ' %' : '—'}</div><div class="l">porcentaje global</div></div>
        <div class="kpi"><div class="v">${c.p}</div><div class="l">errores pendientes</div></div>
        <div class="kpi"><div class="v">${c.s}</div><div class="l">errores superados</div></div>
      </div>
      <div class="grid2">
        <div class="card"><span class="eyebrow">Evolución</span><h3 class="h3" style="margin:6px 0 4px">Porcentaje de aciertos por cuestionario</h3><p class="small muted" style="margin-bottom:12px">Últimos ${Math.min(H.length, 30)} entrenamientos</p>
          ${H.length >= 2 ? `<div class="chartbox" id="evoChart"></div>` : `<div class="empty">La gráfica aparecerá a partir de tu segundo entrenamiento.</div>`}</div>
